<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Models</title>
  <link rel="canonical" href="https://www.bstjohn.net/3d-models/">

  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="site.webmanifest">

  <meta name="twitter:description" content="Interactive 3D viewer for printable OpenSCAD models — browse, rotate, and download STL files.">
  <meta name="twitter:image" content="https://www.bstjohn.net/3d-models/og-hero.png">

  <!-- Plausible Analytics -->
  <script defer data-domain="bstjohn.net" src="https://plausible.bstjohn.net/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script>

  <!-- __STRUCTURED_DATA__ -->

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --header-h: 3.25rem; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      height: var(--header-h);
      padding: 0 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }
    #sidebar-toggle {
      display: none;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: #e0e0e0;
      border-radius: 6px;
      width: 2rem;
      height: 2rem;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }
    #sidebar-toggle:focus-visible { outline: 2px solid #64b5f6; outline-offset: 2px; }

    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - var(--header-h));
    }
    #sidebar {
      overflow-y: auto;
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: #1a1a2e;
    }
    #tree-filter {
      width: 100%;
      background: #16213e;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: #e0e0e0;
      font: inherit;
      font-size: 0.85rem;
      padding: 0.35rem 0.5rem;
    }
    #tree-filter:focus-visible { outline: 2px solid #64b5f6; outline-offset: 1px; }
    #tree-empty {
      font-size: 0.85rem;
      color: #888;
      padding: 0.5rem;
    }

    /* --- Tree browser --- */
    .tree-project[hidden] { display: none; }
    .tree-project-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
      background: transparent;
      border: none;
      color: #64b5f6;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 500;
      text-align: left;
      padding: 0.35rem 0.4rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .tree-project-label::before {
      content: '\25B6';
      font-size: 0.55rem;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .tree-project[aria-expanded="true"] > .tree-project-label::before { transform: rotate(90deg); }
    .tree-project-label:hover { background: rgba(255,255,255,0.06); }
    .tree-project-label:focus-visible { outline: 2px solid #64b5f6; outline-offset: -2px; }
    .tree-project[aria-expanded="false"] > [role="group"],
    .tree-project[aria-expanded="false"] > .tree-project-actions { display: none; }
    .tree-project-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      padding: 0.15rem 0.4rem 0.4rem 1.1rem;
    }
    .tree-model {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      background: transparent;
      border: none;
      color: #e0e0e0;
      font: inherit;
      font-size: 0.82rem;
      text-align: left;
      padding: 0.2rem 0.4rem 0.2rem 1.1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .tree-model[hidden] { display: none; }
    .tree-model:hover { background: rgba(255,255,255,0.06); }
    .tree-model:focus-visible { outline: 2px solid #64b5f6; outline-offset: -2px; }
    .tree-model[aria-selected="true"] {
      background: rgba(100,181,246,0.18);
      color: #64b5f6;
    }
    .tree-model img {
      width: 40px;
      height: 30px;
      object-fit: cover;
      border-radius: 3px;
      background: #0f3460;
      flex-shrink: 0;
    }
    .download-all-btn {
      background: transparent;
      border: 1px solid #64b5f6;
      color: #64b5f6;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      text-decoration: none;
    }
    .download-all-btn:hover { background: rgba(100, 181, 246, 0.1); }
    .download-all-btn:focus-visible {
      outline: 2px solid #64b5f6;
      outline-offset: 2px;
    }

    /* --- Stage / panes --- */
    #stage {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.5rem;
      min-width: 0;
      min-height: 0;
    }
    .stage-toolbar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar-label {
      font-size: 0.78rem;
      color: #888;
      margin-right: 0.15rem;
    }
    .panes {
      display: grid;
      gap: 0.75rem;
      flex: 1;
      min-height: 0;
    }
    .panes--1 { grid-template-columns: 1fr; }
    .panes--2 { grid-template-columns: repeat(2, 1fr); }
    .panes--3 { grid-template-columns: repeat(3, 1fr); }
    .panes--focused > .pane:not(.pane--focused) { display: none; }
    .pane--focused { grid-column: 1 / -1; grid-row: 1 / -1; }
    .pane {
      background: #16213e;
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      min-width: 0;
    }
    .pane--active { outline: 2px solid #64b5f6; outline-offset: -2px; }
    .pane canvas {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: block;
      cursor: grab;
    }
    .pane canvas:active { cursor: grabbing; }
    .pane:fullscreen, .pane:-webkit-full-screen { background: #1a1a2e; }
    .pane:fullscreen canvas { flex: 1; height: auto; min-height: 0; max-height: none; }
    .pane:-webkit-full-screen canvas { flex: 1; height: auto; min-height: 0; max-height: none; }
    .pane-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7d88a8;
      font-size: 0.95rem;
      pointer-events: none;
    }
    .pane-empty[hidden] { display: none; }
    .pane-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      padding: 0.4rem 6.5rem 0.4rem 0.5rem;
      flex-shrink: 0;
    }
    .pane-chips[hidden] { display: none; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 0.1rem 0.45rem;
      font-size: 0.75rem;
      max-width: 100%;
    }
    .chip-dl {
      color: #64b5f6;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip-dl:hover { text-decoration: underline; }
    .chip-dl:focus-visible { outline: 2px solid #64b5f6; outline-offset: 2px; }
    .chip-remove {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 0.75rem;
      line-height: 1;
      padding: 0;
      font-family: inherit;
    }
    .chip-remove:hover { color: #fff; }
    .chip-remove:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .pane-actions {
      position: absolute;
      top: 0.4rem;
      right: 0.4rem;
      display: flex;
      gap: 0.3rem;
      z-index: 3;
    }
    .pane-btn {
      background: rgba(0,0,0,0.4);
      border: none;
      color: #e0e0e0;
      font-size: 1rem;
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    .pane-btn[hidden] { display: none; }
    .pane:hover .pane-btn, .pane:focus-within .pane-btn { opacity: 1; }
    @media (hover: none) { .pane-btn { opacity: 1; } }
    .pane-btn:hover { background: rgba(0,0,0,0.6); }
    .pane-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
      opacity: 1;
    }
    .pane-btn[aria-pressed="true"] { background: rgba(100,181,246,0.4); opacity: 1; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .color-picker {
      display: flex;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .color-picker[hidden] { display: none; }
    .color-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }
    .color-swatch[aria-pressed="true"] {
      border-color: #fff;
    }
    .color-swatch:hover {
      border-color: rgba(255,255,255,0.6);
    }
    .color-swatch:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    .card-info {
      padding: 0.6rem 1rem 0.75rem;
      display: flex;
      gap: 0.75rem;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .card-info h3 {
      font-size: 1rem;
      font-weight: 450;
    }
    .card-links {
      display: flex;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .card-links a {
      color: #64b5f6;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .card-links a:hover { text-decoration: underline; }
    .card-links a:focus-visible {
      outline: 2px solid #64b5f6;
      outline-offset: 2px;
    }
    .print-time {
      font-size: 0.8rem;
      color: #aaa;
      white-space: nowrap;
    }
    .pane-desc {
      font-size: 0.8rem;
      color: #9aa4bf;
      flex: 1 1 100%;
      margin: 0;
    }
    .pane-desc summary { cursor: pointer; color: #64b5f6; }
    .pane-desc p { margin: 0.4rem 0 0; }
    .printing-notes {
      flex: 1 1 100%;
      margin: 0;
      font-size: 0.8rem;
      color: #ccc;
      background: rgba(255,255,255,0.04);
      border-left: 3px solid #64b5f6;
      border-radius: 4px;
      padding: 0.4rem 0.6rem;
    }
    .printing-notes summary { cursor: pointer; color: #64b5f6; font-size: 0.8rem; }
    .printing-notes ul { margin: 0.4rem 0 0 1.1rem; }
    .printing-notes li { margin-bottom: 0.3rem; line-height: 1.4; }
    .qr-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .qr-popover {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      max-width: 320px;
    }
    .qr-popover img {
      width: 256px;
      height: 256px;
      image-rendering: pixelated;
      border-radius: 4px;
    }
    .qr-popover p {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #aaa;
      word-break: break-all;
    }
    .loading {
      text-align: center;
      padding: 4rem;
      font-size: 1.2rem;
      color: #888;
    }
    .touch-hint {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      pointer-events: none;
      z-index: 2;
      opacity: 1;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    .touch-hint.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .touch-hint-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .touch-hint svg {
      width: 40px;
      height: 40px;
    }
    .touch-hint span {
      font-size: 0.75rem;
      color: #fff;
      white-space: nowrap;
    }
    .pane-controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      flex-wrap: wrap;
    }
    .cross-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 4px;
      color: #e0e0e0;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 13px;
      flex-shrink: 0;
      white-space: nowrap;
      font-family: inherit;
    }
    .cross-btn:hover { background: rgba(255,255,255,0.2); }
    .cross-btn:disabled { opacity: 0.4; cursor: default; }
    .cross-btn[aria-pressed="true"] {
      background: rgba(100, 181, 246, 0.3);
      color: #64b5f6;
    }
    .cross-btn:focus-visible {
      outline: 2px solid #64b5f6;
      outline-offset: 2px;
    }
    .clip-slider {
      flex: 1 1 120px;
      min-width: 80px;
      accent-color: #64b5f6;
    }
    .view-btn, .layout-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 4px;
      color: #e0e0e0;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 13px;
      flex-shrink: 0;
      white-space: nowrap;
      font-family: inherit;
    }
    .view-btn:hover, .layout-btn:hover { background: rgba(255,255,255,0.2); }
    .view-btn:focus-visible, .layout-btn:focus-visible { outline: 2px solid #64b5f6; outline-offset: 2px; }
    .view-btn:disabled { opacity: 0.4; cursor: default; }
    .view-btn[aria-pressed="true"], .layout-btn[aria-pressed="true"] { background: rgba(100,181,246,0.3); color: #64b5f6; }
    .customize-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 4px;
      color: #e0e0e0;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 13px;
      flex-shrink: 0;
      white-space: nowrap;
      font-family: inherit;
    }
    .customize-btn:hover { background: rgba(255,255,255,0.2); }
    .customize-btn[aria-pressed="true"] {
      background: rgba(100, 181, 246, 0.3);
      color: #64b5f6;
    }
    .customize-btn:focus-visible {
      outline: 2px solid #64b5f6;
      outline-offset: 2px;
    }
    .customizer-panel {
      padding: 6px 12px 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(0,0,0,0.15);
      max-height: 40%;
      overflow-y: auto;
    }
    .customizer-panel.open { display: flex; }
    .param-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .param-row label {
      flex: 0 0 auto;
      min-width: 110px;
      color: #cfd8dc;
    }
    .param-row input[type="range"] {
      flex: 1;
      accent-color: #64b5f6;
    }
    .param-row input[type="checkbox"] {
      accent-color: #64b5f6;
    }
    .param-row .param-value {
      flex: 0 0 auto;
      min-width: 40px;
      text-align: right;
      color: #aaa;
      font-variant-numeric: tabular-nums;
    }
    .customizer-status {
      font-size: 12px;
      color: #aaa;
      min-height: 1.1em;
    }
    .customizer-status.error { color: #ef5350; }
    .customizer-download {
      color: #64b5f6;
      font-size: 13px;
      text-decoration: none;
    }
    .customizer-download:hover { text-decoration: underline; }
    .customizer-download[hidden] { display: none; }
    .customizer-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .rerender-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 4px;
      color: #e0e0e0;
      cursor: pointer;
      padding: 4px 10px;
      font-size: 13px;
      flex-shrink: 0;
      white-space: nowrap;
      font-family: inherit;
    }
    .rerender-btn:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
    .rerender-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .rerender-btn.dirty {
      background: rgba(100, 181, 246, 0.3);
      color: #64b5f6;
    }
    .rerender-btn:focus-visible {
      outline: 2px solid #64b5f6;
      outline-offset: 2px;
    }
    .param-row.param-row--dirty label {
      color: #64b5f6;
    }

    @media (max-width: 900px) {
      #sidebar-toggle { display: flex; }
      .app { grid-template-columns: 1fr; }
      #sidebar {
        position: fixed;
        top: var(--header-h);
        left: 0;
        bottom: 0;
        width: 280px;
        z-index: 60;
        transform: translateX(-100%);
        transition: transform 0.2s;
        box-shadow: 4px 0 16px rgba(0,0,0,0.4);
      }
      body.sidebar-open #sidebar { transform: none; }

      /* Issue #307: on phones the pane chrome (chips, colours, one controls
         row, collapsed description and printing notes) no longer fits in one
         viewport height, so `flex: 1` collapsed the canvas to a sliver and the
         rest was clipped by `.pane { overflow: hidden }`. Below 900px the page
         scrolls instead: the canvas takes a fixed slice of the viewport and
         everything else flows underneath. */
      body { overflow-x: hidden; overflow-y: auto; }
      body.sidebar-open { overflow: hidden; }
      header {
        position: sticky;
        top: 0;
        z-index: 70;
        background: #1a1a2e;
      }
      .app { height: auto; }
      #stage { padding: 0.5rem 0.5rem 1.5rem; }
      .panes { flex: none; }
      .panes--1, .panes--2, .panes--3 {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }
      .pane canvas {
        flex: none;
        height: 55vh;
        height: 55dvh;
        min-height: 240px;
      }
      .customizer-panel { max-height: 60vh; }
      .touch-hint { gap: 1rem; flex-wrap: wrap; }
      .view-btn, .cross-btn, .customize-btn, .layout-btn, .rerender-btn {
        padding: 8px 12px;
        font-size: 14px;
        min-height: 40px;
      }
      .qr-popover { max-width: min(320px, calc(100vw - 2rem)); }
      .qr-popover img { width: 100%; max-width: 256px; height: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <button id="sidebar-toggle" type="button" aria-label="Toggle model list" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
    <h1>3D Models</h1>
  </header>
  <div class="app">
    <aside id="sidebar">
      <input id="tree-filter" type="search" placeholder="Filter models&hellip;" aria-label="Filter models" autocomplete="off">
      <nav id="tree" role="tree" aria-label="Model browser"></nav>
      <p id="tree-empty" hidden>No matching models</p>
    </aside>
    <main id="stage">
      <div class="stage-toolbar">
        <span class="toolbar-label">Layout</span>
        <button class="layout-btn" type="button" data-layout="1" aria-pressed="true" aria-label="Show one viewer pane">1</button>
        <button class="layout-btn" type="button" data-layout="2" aria-pressed="false" aria-label="Show two viewer panes">2</button>
        <button class="layout-btn" type="button" data-layout="3" aria-pressed="false" aria-label="Show three viewer panes">3</button>
        <button id="add-mode" class="layout-btn" type="button" aria-pressed="false" aria-label="Add selected models to the active pane instead of replacing">&plus; Add to scene</button>
      </div>
      <div id="panes" class="panes panes--1">
        <div class="loading">Loading models&hellip;</div>
      </div>
      <div id="sr-status" aria-live="polite" class="sr-only"></div>
    </main>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const panesEl = document.getElementById('panes');
    const treeEl = document.getElementById('tree');
    const treeEmptyEl = document.getElementById('tree-empty');
    const filterInput = document.getElementById('tree-filter');
    const srStatus = document.getElementById('sr-status');
    const addModeBtn = document.getElementById('add-mode');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const layoutBtns = [...document.querySelectorAll('.layout-btn[data-layout]')];

    // openscad-wasm renders run in a dedicated Web Worker so the CGAL/mesh
    // export work doesn't freeze the main thread. One worker is shared by
    // every customizer panel on the page — the worker processes incoming
    // messages sequentially, which is the right semantics anyway since the
    // non-threaded wasm build is single-threaded.
    let _wasmWorker = null;
    let _nextRenderId = 1;
    const _pendingRenders = new Map();
    function getWasmWorker() {
      if (_wasmWorker) return _wasmWorker;
      const url = new URL(`./openscad-worker.js${cacheBust}`, import.meta.url);
      const worker = new Worker(url, { type: 'module' });
      worker.addEventListener('message', (event) => {
        const { id, stl, error } = event.data;
        const pending = _pendingRenders.get(id);
        if (!pending) return;
        _pendingRenders.delete(id);
        if (error) pending.reject(new Error(error));
        else pending.resolve(stl);
      });
      worker.addEventListener('error', (event) => {
        // A worker-level error invalidates every in-flight render; reject
        // them all so the UI can recover with an error status.
        for (const pending of _pendingRenders.values()) {
          pending.reject(new Error(event.message || 'Worker error'));
        }
        _pendingRenders.clear();
        worker.terminate();
        _wasmWorker = null;
      });
      _wasmWorker = worker;
      return worker;
    }

    function renderInWorker(payload) {
      const worker = getWasmWorker();
      const id = _nextRenderId++;
      return new Promise((resolve, reject) => {
        _pendingRenders.set(id, { resolve, reject });
        worker.postMessage({ id, ...payload });
      });
    }

    // Per-project library cache: dir -> Promise<Map<filename, source>>.
    const _projectSourcesCache = new Map();
    async function loadProjectSources(projectDir) {
      if (_projectSourcesCache.has(projectDir)) {
        return _projectSourcesCache.get(projectDir);
      }
      const promise = (async () => {
        const base = `sources/${projectDir}`;
        const manifestResp = await fetch(`${base}/manifest.json${cacheBust}`);
        if (!manifestResp.ok) throw new Error(`manifest.json missing for ${projectDir}`);
        const names = await manifestResp.json();
        const entries = await Promise.all(names.map(async (name) => {
          const r = await fetch(`${base}/${encodeURIComponent(name)}${cacheBust}`);
          if (!r.ok) throw new Error(`failed to fetch ${name}: ${r.status}`);
          // surface()/import() binary assets must be written to the wasm FS as
          // raw bytes — decoding a PNG via r.text() corrupts it.
          const isBinary = /\.(png|stl)$/i.test(name);
          return [name, isBinary ? new Uint8Array(await r.arrayBuffer()) : await r.text()];
        }));
        return new Map(entries);
      })();
      promise.catch(() => _projectSourcesCache.delete(projectDir));
      _projectSourcesCache.set(projectDir, promise);
      return promise;
    }

    function formatTime(m) {
      if (m < 60) return `${m}m`;
      const h = Math.floor(m / 60);
      const rem = m % 60;
      if (rem === 0) return `${h}h`;
      return `${h}h ${rem}m`;
    }

    // Touch gesture hint icons (inline SVGs)
    const TOUCH_ICON_ROTATE = `<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="22" r="4"/>
      <path d="M30 18a12 12 0 1 0-3.5 8.5"/>
      <path d="M30 22v-4h-4"/>
    </svg>`;
    const TOUCH_ICON_ZOOM = `<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20l-6 6M12 20l-6-6"/>
      <path d="M28 20l6 6M28 20l6-6"/>
      <circle cx="12" cy="20" r="3" fill="#fff" stroke="none"/>
      <circle cx="28" cy="20" r="3" fill="#fff" stroke="none"/>
    </svg>`;
    const TOUCH_ICON_PAN = `<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="18" r="3" fill="#fff" stroke="none"/>
      <circle cx="24" cy="18" r="3" fill="#fff" stroke="none"/>
      <path d="M20 26l-5 5M20 26l5 5M20 26V18"/>
    </svg>`;
    const ICON_EXPAND = `<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
  <path d="M1 1h4v1.5H3.06L5.5 4.94 4.44 6 2 3.56V5.5H.5V1H1zm12 0v4.5H11.5V3.56L9.06 6 8 4.94 10.44 2.5H8.5V1H13zm0 12h-4.5v-1.5h1.94L8 9.06 9.06 8 11.5 10.44V8.5H13V13zm-12 0V8.5H.5v1.94L2.94 8 4 9.06 1.56 11.5H3.5V13H1z"/>
</svg>`;
    const ICON_QR = `<svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
      <rect x="1" y="1" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="3" y="3" width="3" height="3"/>
      <rect x="10" y="1" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="12" y="3" width="3" height="3"/>
      <rect x="1" y="10" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="3" y="12" width="3" height="3"/>
      <rect x="11" y="11" width="2" height="2"/>
      <rect x="15" y="11" width="2" height="2"/>
      <rect x="11" y="15" width="2" height="2"/>
      <rect x="15" y="15" width="2" height="2"/>
      <rect x="13" y="13" width="2" height="2"/>
    </svg>`;

    let touchHintShown = sessionStorage.getItem('touchHintSeen') === '1';

    function showTouchHint(pane) {
      if (!pane?.hintOverlay) return;
      const overlay = pane.hintOverlay;
      overlay.style.display = 'flex';

      let dismissed = false;
      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        clearTimeout(timer);
        overlay.classList.add('fade-out');
        overlay.addEventListener('transitionend', () => {
          overlay.style.display = 'none';
        }, { once: true });
        pane.canvas.removeEventListener('touchmove', dismiss);
      }

      const timer = setTimeout(dismiss, 5000);
      pane.canvas.addEventListener('touchmove', dismiss, { once: true, passive: true });
      sessionStorage.setItem('touchHintSeen', '1');
    }

    let FILAMENT_COLORS = [];

    function displayName(filename) {
      return filename.replace(/\.stl$/i, '').replace(/[-_]/g, ' ');
    }

    // Must stay in sync with scripts/generate-gallery.py:slugify()
    function slugify(str) {
      return str.replace(/\.stl$/i, '').replace(/[_\s]+/g, '-').toLowerCase();
    }

    // Keep in sync with PUBLIC_REPO_URL in scripts/oembed_helpers.py and embed.html.
    const PUBLIC_REPO = 'https://github.com/stjohnb/3d-models';
    function publicSourceUrl(source) {
      if (!source) return '';
      return `${PUBLIC_REPO}/blob/main/${source.split('/').map(encodeURIComponent).join('/')}`;
    }

    function loadSTL(url) {
      return new Promise((resolve, reject) => {
        new STLLoader().load(url, resolve, undefined, reject);
      });
    }

    // ------------------------------------------------------------------
    // Viewer
    // ------------------------------------------------------------------

    // Cap the drawing-buffer resolution. Retina DPR 2 quadruples fragment cost
    // for a barely-visible quality gain; 1.5 keeps edges clean under MSAA.
    const MAX_PIXEL_RATIO = 1.5;

    // One viewer per pane. A pane can hold any number of models: each model
    // (single mesh, or a multi-part coloured composite) becomes its own
    // THREE.Group under a shared root, laid out side by side along world X.
    function createViewer(canvas) {
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'low-power' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO));
      renderer.localClippingEnabled = true;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f3460);

      const camera = new THREE.PerspectiveCamera(45, (canvas.clientWidth / canvas.clientHeight) || 1, 0.1, 10000);

      // Frame-scheduling state for the on-demand render loop further down.
      // Declared up here because makeControls() attaches invalidate() as an
      // OrbitControls listener, and OrbitControls.update() can dispatch
      // 'change' synchronously — these must not be in their TDZ by then.
      let rafId = null;
      let paused = false;
      let needsRender = true;
      let idleFrames = 0;
      let lastW = 0, lastH = 0;

      // Rebuilt (not just reset) by resetView() so OrbitControls' internal
      // spherical state is discarded along with the camera position.
      let controls = null;
      function makeControls() {
        const saved = controls ? controls.target.clone() : new THREE.Vector3();
        if (controls) controls.dispose();
        controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        // Re-attached here (not at the call sites) because resetView() rebuilds
        // the controls object and drops the old one's listeners.
        controls.addEventListener('change', invalidate);
        controls.target.copy(saved);
        controls.update();
      }

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(1, 2, 3);
      scene.add(dirLight);
      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight2.position.set(-2, -1, -1);
      scene.add(dirLight2);

      const root = new THREE.Group();
      scene.add(root);

      const handle = {
        scene,
        camera,
        // Every model in the pane hangs off this shared group, so rotate90 /
        // resetView / computeClipBBox operate on the whole scene contents.
        root,
        // Materials whose clipping planes the cross-section toggles.
        materials: [],
        // Subset the filament colour picker drives — composite parts keep
        // their declared colours and are excluded.
        filamentMaterials: [],
        filamentColor: null,
        defaultCameraPos: null,
        loadToken: 0,
      };

      makeControls();

      function clearRoot() {
        root.traverse((o) => {
          if (o.isMesh) {
            o.geometry.dispose();
            o.material.dispose();
          }
        });
        root.clear();
        handle.materials = [];
        handle.filamentMaterials = [];
      }

      function frameRoot() {
        root.rotation.set(0, 0, 0);
        const box = new THREE.Box3().setFromObject(root);
        if (box.isEmpty()) return null;
        const size = new THREE.Vector3();
        box.getSize(size);
        const dist = Math.max(size.x, size.y, size.z) * 1.8;
        camera.position.set(dist * 0.6, dist * 0.5, dist * 0.8);
        handle.defaultCameraPos = camera.position.clone();
        controls.target.set(0, 0, 0);
        controls.update();
        return { minY: box.min.y, maxY: box.max.y };
      }

      function makeMaterial(color) {
        return new THREE.MeshPhongMaterial({
          color,
          specular: 0x222222,
          shininess: 40,
          clippingPlanes: [],
          clipShadows: false,
        });
      }

      // World-space Y extent of the current scene contents — drives the
      // cross-section clip plane. Recomputed after a rotation since rotating
      // changes the axis-aligned bounding box.
      function computeClipBBox() {
        if (!root.children.length) return null;
        const box = new THREE.Box3().setFromObject(root);
        return { minY: box.min.y, maxY: box.max.y };
      }

      function rotate90(axis) {
        if (!root.children.length) return null;
        const v = axis === 'x' ? new THREE.Vector3(1, 0, 0)
          : axis === 'y' ? new THREE.Vector3(0, 1, 0)
          : new THREE.Vector3(0, 0, 1);
        root.rotateOnWorldAxis(v, Math.PI / 2);
        invalidate();
        return computeClipBBox();
      }

      function resetView() {
        root.rotation.set(0, 0, 0);
        if (handle.defaultCameraPos) camera.position.copy(handle.defaultCameraPos);
        controls.target.set(0, 0, 0);
        camera.up.set(0, 1, 0);
        makeControls();
        invalidate();
        return computeClipBBox();
      }

      // Load and install every model for this pane. `token` guards against
      // out-of-order resolution when the user clicks through the tree fast:
      // only the newest call is allowed to touch the scene.
      async function setModels(entries, token) {
        handle.loadToken = token;

        const loaded = await Promise.all(entries.map(async (entry) => {
          if (entry.composite && entry.composite.length) {
            const geometries = await Promise.all(entry.composite.map(p => loadSTL(p.url)));
            if (entry.viewerRotateX) {
              for (const g of geometries) g.rotateX(-Math.PI / 2);
            }
            return geometries.map((geometry, i) => ({ geometry, color: entry.composite[i].color }));
          }
          const geometry = await loadSTL(entry.stlUrl);
          // Print-oriented models keep OpenSCAD's native Z-up in the STL (so the
          // download stays correctly oriented for slicing); when the source
          // can't apply a Z-up -> Y-up rotate() without misprinting, meta.json's
          // viewer_rotate_x asks for that same correction here instead, purely
          // for display. Must happen before the bounding-box math below so the
          // cross-section/camera framing operate on the corrected axes.
          if (entry.viewerRotateX) geometry.rotateX(-Math.PI / 2);
          return [{ geometry, color: null }];
        }));

        if (token !== handle.loadToken) {
          for (const parts of loaded) for (const p of parts) p.geometry.dispose?.();
          return null;
        }

        clearRoot();

        const materials = [];
        const filamentMaterials = [];
        const built = loaded.map((parts) => {
          // Centre each model on its own origin so the layout maths below only
          // has to deal with widths, not arbitrary source-space offsets.
          const box = new THREE.Box3();
          for (const p of parts) {
            p.geometry.computeBoundingBox();
            box.union(p.geometry.boundingBox);
          }
          const centre = new THREE.Vector3();
          box.getCenter(centre);
          const size = new THREE.Vector3();
          box.getSize(size);

          const group = new THREE.Group();
          for (const p of parts) {
            p.geometry.translate(-centre.x, -centre.y, -centre.z);
            const mat = makeMaterial(p.color !== null ? p.color : (handle.filamentColor ?? 0x64b5f6));
            materials.push(mat);
            if (p.color === null) filamentMaterials.push(mat);
            group.add(new THREE.Mesh(p.geometry, mat));
          }
          return { group, width: size.x };
        });

        // Lay the models out left-to-right with a gap proportional to the
        // widest one, then recentre the whole row on the origin. A single
        // model lands at x = 0, i.e. framed exactly as before.
        const gap = 0.15 * Math.max(...built.map(b => b.width), 0);
        let x = 0;
        for (const b of built) {
          b.group.position.x = x + b.width / 2;
          x += b.width + gap;
        }
        const shift = (x - gap) / 2;
        for (const b of built) {
          b.group.position.x -= shift;
          root.add(b.group);
        }

        handle.materials = materials;
        handle.filamentMaterials = filamentMaterials;
        const framed = frameRoot();
        invalidate();
        return framed;
      }

      function clear(token) {
        handle.loadToken = token;
        clearRoot();
        invalidate();
      }

      function setFilamentColor(hex) {
        handle.filamentColor = hex;
        for (const m of handle.filamentMaterials) m.color.setHex(hex);
        invalidate();
      }

      // Swap in a freshly customizer-rendered mesh. Only meaningful for a
      // single-model pane; reuses the existing material (and therefore the
      // active filament colour and clipping planes) when there is one.
      function replaceGeometry(geometry) {
        geometry.center();
        geometry.computeBoundingBox();
        const group = root.children.length === 1 ? root.children[0] : null;
        const mesh = group && group.children.length === 1 ? group.children[0] : null;
        if (mesh) {
          mesh.geometry.dispose();
          mesh.geometry = geometry;
          group.position.x = 0;
        } else {
          clearRoot();
          const mat = makeMaterial(handle.filamentColor ?? 0x64b5f6);
          handle.materials = [mat];
          handle.filamentMaterials = [mat];
          const g = new THREE.Group();
          g.add(new THREE.Mesh(geometry, mat));
          root.add(g);
        }
        // Invalidate any still-in-flight default-STL load so it can't
        // overwrite the customized mesh when it resolves.
        handle.loadToken += 1;
        const framed = frameRoot();
        invalidate();
        return framed;
      }

      // Frames of no camera movement and no invalidate() before the loop
      // suspends itself. Generous (~1.5s) so OrbitControls' damping coast and
      // any short CSS size transition always finish drawing.
      const IDLE_FRAMES_BEFORE_SUSPEND = 90;

      // Request one more drawn frame and wake the loop if it has suspended.
      function invalidate() {
        needsRender = true;
        idleFrames = 0;
        if (!paused && rafId === null) rafId = requestAnimationFrame(animate);
      }

      // Callers invalidate; a zero-size canvas (a pane hidden by focus mode)
      // returns early without recording the size, so it re-sizes correctly
      // when it reappears.
      function resize() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        if (w === 0 || h === 0) return;
        if (w !== lastW || h !== lastH) {
          lastW = w; lastH = h;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
      }

      // The observer owns resizing — animate() must not poll clientWidth,
      // which forces a layout flush on every frame of every pane. It fires
      // only on a real box change, and always invalidates: leaving focus mode
      // un-hides a pane at the CSS size it already had, so resize() finds
      // nothing to do even though the compositor discarded the frame.
      const resizeObserver = new ResizeObserver(() => { resize(); invalidate(); });
      resizeObserver.observe(canvas);

      canvas.addEventListener('pointerdown', invalidate);
      canvas.addEventListener('wheel', invalidate, { passive: true });
      canvas.addEventListener('touchstart', invalidate, { passive: true });

      function animate() {
        rafId = requestAnimationFrame(animate);
        const moved = controls.update();
        if (needsRender || moved) {
          needsRender = false;   // cleared before render so a change fired
          idleFrames = 0;        // during rendering isn't swallowed
          renderer.render(scene, camera);
        } else if (++idleFrames > IDLE_FRAMES_BEFORE_SUSPEND) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      function start() {
        paused = false;
        resize();
        invalidate();
      }

      function stop() {
        paused = true;
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      function dispose() {
        stop();
        resizeObserver.disconnect();
        controls.dispose();
        clearRoot();
        renderer.dispose();
        renderer.forceContextLoss();
      }

      start();
      Object.assign(handle, {
        start, stop, dispose,
        // Rendering is on-demand: any code that mutates this viewer's scene,
        // materials, or clipping planes from outside createViewer must call
        // invalidate() or the change won't appear until the camera next moves.
        invalidate,
        setModels, clear, setFilamentColor, replaceGeometry,
        rotate90, resetView,
        getControls: () => controls,
      });
      return handle;
    }

    // Cache-busting hash injected at build time
    const BUILD_HASH = '__BUILD_HASH__';
    const cacheBust = BUILD_HASH.startsWith('__') ? '' : `?v=${BUILD_HASH}`;

    function showQrPopover(qrPath, modelName) {
      document.querySelector('.qr-overlay')?.remove();

      const overlay = document.createElement('div');
      overlay.className = 'qr-overlay';
      const popover = document.createElement('div');
      popover.className = 'qr-popover';

      const img = document.createElement('img');
      img.src = qrPath + cacheBust;
      img.alt = `QR code for ${modelName}`;
      popover.appendChild(img);

      const caption = document.createElement('p');
      caption.textContent = modelName;
      popover.appendChild(caption);

      overlay.appendChild(popover);
      function dismiss() {
        overlay.remove();
        document.removeEventListener('keydown', onKey);
      }
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) dismiss();
      });
      document.body.appendChild(overlay);

      function onKey(e) {
        if (e.key === 'Escape') dismiss();
      }
      document.addEventListener('keydown', onKey);
    }

    // ------------------------------------------------------------------
    // Model index
    // ------------------------------------------------------------------

    let MODEL_INDEX = [];

    function buildModelIndex(models) {
      const index = [];
      for (const [projectName, projectData] of Object.entries(models).sort(([a], [b]) => a.localeCompare(b))) {
        const projectSlug = slugify(projectName);
        for (const model of (projectData.files || [])) {
          // Composite descriptor: when meta.json declares this STL is a
          // coloured multi-part assembly, load the part STLs instead (issue
          // #275). Colours are re-validated here as defence-in-depth even
          // though the schema already enforces #rrggbb.
          const composite = (projectData.assembly && projectData.assembly.stl === model.stl
              && Array.isArray(projectData.assembly.parts))
            ? projectData.assembly.parts
                .filter(p => typeof p.stl === 'string' && /^#[0-9a-fA-F]{6}$/.test(p.color))
                .map(p => ({ url: `${p.stl}${cacheBust}`, color: p.color }))
            : null;
          const name = displayName(model.stl);
          index.push({
            projectName,
            projectData,
            model,
            projectSlug,
            modelSlug: slugify(model.stl),
            name,
            composite,
            stlUrl: `${model.stl}${cacheBust}`,
            viewerRotateX: !!projectData.viewer_rotate_x,
            haystack: `${projectName} ${name} ${(projectData.tags || []).join(' ')}`.toLowerCase(),
          });
        }
      }
      return index;
    }

    function resolveRef(spec) {
      if (spec.m) {
        return MODEL_INDEX.find(r => r.projectSlug === spec.p && r.modelSlug === spec.m) || null;
      }
      return MODEL_INDEX.find(r => r.projectSlug === spec.p) || null;
    }

    // ------------------------------------------------------------------
    // Tree browser
    // ------------------------------------------------------------------

    const projectNodes = new Map();
    const projectOrder = [];
    const modelBtnRef = new Map();
    let savedExpansion = null;

    function setExpanded(node, expanded) {
      node.el.setAttribute('aria-expanded', String(expanded));
      node.labelBtn.setAttribute('aria-expanded', String(expanded));
    }

    function setRoving(el) {
      for (const item of treeEl.querySelectorAll('.tree-project-label, .tree-model')) {
        item.tabIndex = item === el ? 0 : -1;
      }
    }

    function focusTreeItem(el) {
      if (!el) return;
      setRoving(el);
      el.focus();
    }

    function visibleTreeItems() {
      const out = [];
      for (const node of projectOrder) {
        if (node.el.hidden) continue;
        out.push(node.labelBtn);
        if (node.el.getAttribute('aria-expanded') === 'true') {
          for (const btn of node.modelBtns) if (!btn.hidden) out.push(btn);
        }
      }
      return out;
    }

    function isAdditive(event) {
      return addModeBtn.getAttribute('aria-pressed') === 'true'
        || Boolean(event && (event.ctrlKey || event.metaKey));
    }

    function buildTree(models) {
      const byProject = new Map();
      for (const ref of MODEL_INDEX) {
        if (!byProject.has(ref.projectName)) byProject.set(ref.projectName, []);
        byProject.get(ref.projectName).push(ref);
      }

      for (const [projectName, projectData] of Object.entries(models).sort(([a], [b]) => a.localeCompare(b))) {
        const refs = byProject.get(projectName) || [];
        const projectSlug = slugify(projectName);

        const el = document.createElement('div');
        el.className = 'tree-project';
        el.setAttribute('role', 'treeitem');
        el.setAttribute('aria-expanded', 'false');
        el.setAttribute('aria-label', projectName);
        el.dataset.slug = projectSlug;

        const labelBtn = document.createElement('button');
        labelBtn.type = 'button';
        labelBtn.className = 'tree-project-label';
        labelBtn.textContent = projectName;
        labelBtn.tabIndex = -1;
        labelBtn.setAttribute('aria-expanded', 'false');
        el.appendChild(labelBtn);

        const actions = document.createElement('div');
        actions.className = 'tree-project-actions';

        if (projectData.zip) {
          const zipBtn = document.createElement('a');
          zipBtn.className = 'download-all-btn';
          zipBtn.href = `${projectData.zip}${cacheBust}`;
          zipBtn.download = projectData.zip;
          zipBtn.textContent = `Download All (${refs.length} STLs)`;
          zipBtn.setAttribute('aria-label', `Download all ${refs.length} STLs for ${projectName}`);
          actions.appendChild(zipBtn);
        }

        if (projectData.sourceZip) {
          const srcBtn = document.createElement('a');
          srcBtn.className = 'download-all-btn';
          srcBtn.href = `${projectData.sourceZip}${cacheBust}`;
          srcBtn.download = projectData.sourceZip;
          srcBtn.textContent = 'Download Source';
          srcBtn.setAttribute('aria-label', `Download source files for ${projectName}`);
          actions.appendChild(srcBtn);
        }

        if (projectData.dir) {
          const repoBtn = document.createElement('a');
          repoBtn.className = 'download-all-btn';
          repoBtn.href = `${PUBLIC_REPO}/tree/main/${projectData.dir.split('/').map(encodeURIComponent).join('/')}`;
          repoBtn.target = '_blank';
          repoBtn.rel = 'noopener noreferrer';
          repoBtn.textContent = 'View on GitHub';
          repoBtn.setAttribute('aria-label', `View ${projectName} source directory on GitHub`);
          actions.appendChild(repoBtn);
        }

        el.appendChild(actions);

        const group = document.createElement('div');
        group.setAttribute('role', 'group');
        group.setAttribute('aria-label', `${projectName} models`);

        const modelBtns = [];
        for (const ref of refs) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tree-model';
          btn.setAttribute('role', 'treeitem');
          btn.setAttribute('aria-selected', 'false');
          btn.dataset.projectSlug = ref.projectSlug;
          btn.dataset.modelSlug = ref.modelSlug;
          btn.tabIndex = -1;

          const thumb = document.createElement('img');
          thumb.src = `${ref.model.stl.replace(/\.stl$/i, '.png')}${cacheBust}`;
          thumb.loading = 'lazy';
          thumb.decoding = 'async';
          thumb.alt = '';
          thumb.width = 40;
          thumb.height = 30;
          thumb.onerror = () => { thumb.style.display = 'none'; };
          btn.appendChild(thumb);

          const label = document.createElement('span');
          label.textContent = ref.name;
          btn.appendChild(label);

          btn.addEventListener('click', (ev) => onTreeModelActivate(ref, isAdditive(ev)));
          modelBtnRef.set(btn, ref);
          modelBtns.push(btn);
          group.appendChild(btn);
        }

        el.appendChild(group);
        treeEl.appendChild(el);

        const node = { projectName, projectSlug, el, labelBtn, modelBtns };
        labelBtn.addEventListener('click', () => {
          setExpanded(node, node.el.getAttribute('aria-expanded') !== 'true');
        });
        projectNodes.set(projectSlug, node);
        projectOrder.push(node);
      }

      if (projectOrder.length) setRoving(projectOrder[0].labelBtn);
    }

    treeEl.addEventListener('focusin', (e) => {
      if (e.target.matches('.tree-project-label, .tree-model')) setRoving(e.target);
    });

    treeEl.addEventListener('keydown', (e) => {
      const active = document.activeElement;
      if (!active || !active.matches?.('.tree-project-label, .tree-model')) return;
      const node = projectOrder.find(n => n.labelBtn === active);
      const parent = node ? null : projectOrder.find(n => n.modelBtns.includes(active));

      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const items = visibleTreeItems();
        const idx = items.indexOf(active);
        if (idx === -1) return;
        e.preventDefault();
        const next = e.key === 'ArrowDown' ? idx + 1 : idx - 1;
        if (next >= 0 && next < items.length) focusTreeItem(items[next]);
        return;
      }
      if (e.key === 'Home' || e.key === 'End') {
        const items = visibleTreeItems();
        if (!items.length) return;
        e.preventDefault();
        focusTreeItem(e.key === 'Home' ? items[0] : items[items.length - 1]);
        return;
      }
      if (e.key === 'ArrowRight') {
        if (!node) return;
        e.preventDefault();
        if (node.el.getAttribute('aria-expanded') !== 'true') {
          setExpanded(node, true);
        } else {
          focusTreeItem(node.modelBtns.find(b => !b.hidden));
        }
        return;
      }
      if (e.key === 'ArrowLeft') {
        if (node) {
          if (node.el.getAttribute('aria-expanded') === 'true') {
            e.preventDefault();
            setExpanded(node, false);
          }
          return;
        }
        if (parent) {
          e.preventDefault();
          focusTreeItem(parent.labelBtn);
        }
        return;
      }
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (node) {
          setExpanded(node, node.el.getAttribute('aria-expanded') !== 'true');
        } else {
          const ref = modelBtnRef.get(active);
          if (ref) onTreeModelActivate(ref, isAdditive(e));
        }
      }
    });

    filterInput.addEventListener('input', () => {
      const q = filterInput.value.trim().toLowerCase();
      if (q && savedExpansion === null) {
        savedExpansion = new Map(projectOrder.map(n => [n.projectSlug, n.el.getAttribute('aria-expanded') === 'true']));
      }

      let anyVisible = false;
      for (const node of projectOrder) {
        const projectMatch = node.projectName.toLowerCase().includes(q);
        let childMatch = false;
        for (const btn of node.modelBtns) {
          const ref = modelBtnRef.get(btn);
          const show = !q || projectMatch || ref.haystack.includes(q);
          btn.hidden = !show;
          if (show && q) childMatch = true;
        }
        const show = !q || projectMatch || childMatch;
        node.el.hidden = !show;
        if (show) anyVisible = true;
        if (q && show) setExpanded(node, true);
      }

      if (!q && savedExpansion) {
        for (const node of projectOrder) setExpanded(node, savedExpansion.get(node.projectSlug) === true);
        savedExpansion = null;
      }

      treeEmptyEl.hidden = anyVisible;
    });

    function revealInTree(ref) {
      const node = projectNodes.get(ref.projectSlug);
      if (!node) return;
      setExpanded(node, true);
      const btn = node.modelBtns.find(b => modelBtnRef.get(b) === ref);
      if (btn) btn.scrollIntoView({ block: 'nearest' });
    }

    function refreshTreeSelection() {
      const loaded = new Set();
      for (const pane of panes) {
        for (const ref of pane.models) loaded.add(`${ref.projectSlug}/${ref.modelSlug}`);
      }
      for (const [btn, ref] of modelBtnRef) {
        btn.setAttribute('aria-selected', String(loaded.has(`${ref.projectSlug}/${ref.modelSlug}`)));
      }
    }

    // ------------------------------------------------------------------
    // Panes
    // ------------------------------------------------------------------

    const panes = [];
    let activePane = 0;

    function announce(message) {
      srStatus.textContent = message;
    }

    function setActivePane(index) {
      if (index < 0 || index >= panes.length) return;
      activePane = index;
      for (let i = 0; i < panes.length; i++) {
        panes[i].el.classList.toggle('pane--active', i === activePane);
      }
    }

    function toggleFocusPane(pane) {
      const wasFocused = pane.el.classList.contains('pane--focused');
      for (const p of panes) {
        p.el.classList.remove('pane--focused');
        p.focusBtn.setAttribute('aria-pressed', 'false');
      }
      panesEl.classList.toggle('panes--focused', !wasFocused);
      if (!wasFocused) {
        pane.el.classList.add('pane--focused');
        pane.focusBtn.setAttribute('aria-pressed', 'true');
      }
    }

    function toggleFullscreen(pane) {
      if (document.fullscreenElement) document.exitFullscreen();
      else pane.el.requestFullscreen();
    }

    function createPane(index) {
      const el = document.createElement('div');
      el.className = 'pane';

      const chips = document.createElement('div');
      chips.className = 'pane-chips';
      el.appendChild(chips);

      const actions = document.createElement('div');
      actions.className = 'pane-actions';
      el.appendChild(actions);

      const focusBtn = document.createElement('button');
      focusBtn.type = 'button';
      focusBtn.className = 'pane-btn focus-btn';
      focusBtn.setAttribute('aria-label', 'Expand this pane to fill the viewer');
      focusBtn.setAttribute('aria-pressed', 'false');
      focusBtn.innerHTML = ICON_EXPAND;
      actions.appendChild(focusBtn);

      const qrBtn = document.createElement('button');
      qrBtn.type = 'button';
      qrBtn.className = 'pane-btn qr-btn';
      qrBtn.setAttribute('aria-label', 'Show QR code');
      qrBtn.innerHTML = ICON_QR;
      qrBtn.hidden = true;
      actions.appendChild(qrBtn);

      const fsBtn = document.createElement('button');
      fsBtn.type = 'button';
      fsBtn.className = 'pane-btn fullscreen-btn';
      fsBtn.textContent = '⛶';
      fsBtn.setAttribute('aria-label', 'Toggle fullscreen');
      actions.appendChild(fsBtn);

      const canvas = document.createElement('canvas');
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', 'Interactive 3D preview');
      el.appendChild(canvas);

      const emptyMsg = document.createElement('div');
      emptyMsg.className = 'pane-empty';
      emptyMsg.textContent = 'Select a model';
      el.appendChild(emptyMsg);

      // Touch gesture hint overlay (hidden until first touch on mobile)
      const hintOverlay = document.createElement('div');
      hintOverlay.className = 'touch-hint';
      hintOverlay.setAttribute('aria-hidden', 'true');
      hintOverlay.style.display = 'none';
      hintOverlay.innerHTML = `
        <div class="touch-hint-item">${TOUCH_ICON_ROTATE}<span>Rotate</span></div>
        <div class="touch-hint-item">${TOUCH_ICON_ZOOM}<span>Zoom</span></div>
        <div class="touch-hint-item">${TOUCH_ICON_PAN}<span>Pan</span></div>
      `;
      el.appendChild(hintOverlay);

      const colorPicker = document.createElement('div');
      colorPicker.className = 'color-picker';
      colorPicker.setAttribute('aria-label', 'Change filament color');
      for (const color of FILAMENT_COLORS) {
        const swatch = document.createElement('button');
        swatch.type = 'button';
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = `#${color.hex.toString(16).padStart(6, '0')}`;
        swatch.title = color.name;
        swatch.setAttribute('aria-label', color.name);
        if (color.hex === 0x64b5f6) swatch.setAttribute('aria-pressed', 'true');
        swatch.addEventListener('click', () => {
          colorPicker.querySelectorAll('.color-swatch').forEach(s => s.removeAttribute('aria-pressed'));
          swatch.setAttribute('aria-pressed', 'true');
          state.selectedColor = color.hex;
          state.viewer.setFilamentColor(color.hex);
        });
        colorPicker.appendChild(swatch);
      }
      el.appendChild(colorPicker);

      // Pane controls — cross-section toggle, 90° rotation per axis, reset,
      // and the cross-section depth slider, all on one row (issue #337).
      // Disabled until a mesh is loaded.
      const controlsRow = document.createElement('div');
      controlsRow.className = 'pane-controls-row';

      const crossBtn = document.createElement('button');
      crossBtn.type = 'button';
      crossBtn.className = 'cross-btn';
      crossBtn.textContent = '✂ Cross Section';
      crossBtn.setAttribute('aria-label', 'Toggle cross section');
      crossBtn.setAttribute('aria-pressed', 'false');
      crossBtn.disabled = true;

      const clipSlider = document.createElement('input');
      clipSlider.type = 'range';
      clipSlider.className = 'clip-slider';
      clipSlider.min = '0';
      clipSlider.max = '100';
      clipSlider.value = '50';
      clipSlider.setAttribute('aria-label', 'Cross section depth');
      clipSlider.disabled = true;
      clipSlider.style.display = 'none';

      crossBtn.addEventListener('click', () => {
        const active = crossBtn.getAttribute('aria-pressed') === 'true';
        if (active) {
          for (const m of state.viewer.materials) m.clippingPlanes = [];
          state.clipPlane = null;
          clipSlider.style.display = 'none';
          crossBtn.setAttribute('aria-pressed', 'false');
        } else {
          const plane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
          if (state.clipBBox) {
            const { minY, maxY } = state.clipBBox;
            plane.constant = minY + 0.5 * (maxY - minY);
          }
          for (const m of state.viewer.materials) m.clippingPlanes = [plane];
          state.clipPlane = plane;
          clipSlider.value = '50';
          clipSlider.style.display = '';
          crossBtn.setAttribute('aria-pressed', 'true');
        }
        state.viewer.invalidate();
      });

      clipSlider.addEventListener('input', () => {
        if (!state.clipPlane || !state.clipBBox) return;
        const pct = clipSlider.value / 100;
        const { minY, maxY } = state.clipBBox;
        state.clipPlane.constant = minY + pct * (maxY - minY);
        state.viewer.invalidate();
      });

      controlsRow.appendChild(crossBtn);

      // Re-anchor the cross-section clip plane after a rotation/reset changes
      // the model's world-space Y extent.
      function applyClipBBox(bbox) {
        if (!bbox) return;
        state.clipBBox = bbox;
        if (state.clipPlane) {
          const pct = Number(clipSlider.value) / 100;
          state.clipPlane.constant = bbox.minY + pct * (bbox.maxY - bbox.minY);
        }
        state.viewer.invalidate();
      }

      for (const axis of ['x', 'y', 'z']) {
        const rb = document.createElement('button');
        rb.type = 'button';
        rb.className = 'view-btn';
        rb.textContent = `Rotate ${axis.toUpperCase()}`;
        rb.setAttribute('aria-label', `Rotate model 90 degrees about the ${axis.toUpperCase()} axis`);
        rb.disabled = true;
        rb.addEventListener('click', () => applyClipBBox(state.viewer.rotate90(axis)));
        controlsRow.appendChild(rb);
      }

      const resetBtn = document.createElement('button');
      resetBtn.type = 'button';
      resetBtn.className = 'view-btn';
      resetBtn.textContent = 'Reset';
      resetBtn.setAttribute('aria-label', 'Reset view orientation and camera');
      resetBtn.disabled = true;
      resetBtn.addEventListener('click', () => applyClipBBox(state.viewer.resetView()));
      controlsRow.appendChild(resetBtn);

      // Slider last so it takes the row's leftover width, and so the
      // customizer button can be inserted before it.
      controlsRow.appendChild(clipSlider);
      el.appendChild(controlsRow);

      const info = document.createElement('div');
      info.className = 'card-info';
      const title = document.createElement('h3');
      info.appendChild(title);
      el.appendChild(info);

      panesEl.appendChild(el);

      const state = {
        index,
        el,
        canvas,
        viewer: null,
        models: [],
        selectedColor: 0x64b5f6,
        clipBBox: null,
        clipPlane: null,
        loadToken: 0,
        hintOverlay,
        customizerCleanup: null,
        chips,
        colorPicker,
        controlsRow,
        crossBtn,
        clipSlider,
        info,
        title,
        emptyMsg,
        focusBtn,
        qrBtn,
      };

      focusBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFocusPane(state); });
      fsBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(state); });

      el.addEventListener('pointerdown', () => setActivePane(state.index), true);
      el.addEventListener('focusin', () => setActivePane(state.index));

      state.viewer = createViewer(canvas);
      renderPaneChrome(state);

      // Show touch gesture hints immediately on mobile (once per session)
      if (!touchHintShown && ('ontouchstart' in window || navigator.maxTouchPoints > 0)) {
        touchHintShown = true;
        showTouchHint(state);
      }

      return state;
    }

    // Rebuild everything around the canvas that depends on which models the
    // pane currently holds.
    function renderPaneChrome(pane) {
      const refs = pane.models;
      const single = refs.length === 1 ? refs[0] : null;

      // Chips (one per loaded model, each a download link plus a remove ✕).
      pane.chips.replaceChildren();
      pane.chips.hidden = refs.length === 0;
      for (const ref of refs) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        const dl = document.createElement('a');
        dl.className = 'chip-dl';
        dl.href = ref.stlUrl;
        dl.setAttribute('download', '');
        dl.setAttribute('aria-label', `Download STL for ${ref.name}`);
        dl.textContent = ref.name;
        chip.appendChild(dl);
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'chip-remove';
        remove.textContent = '✕';
        remove.setAttribute('aria-label', `Remove ${ref.name} from view`);
        remove.addEventListener('click', (e) => {
          e.stopPropagation();
          setPaneModels(pane, pane.models.filter(m => m !== ref));
        });
        chip.appendChild(remove);
        pane.chips.appendChild(chip);
      }

      pane.canvas.setAttribute('aria-label', refs.length
        ? `Interactive 3D preview of ${refs.map(r => r.name).join(', ')}`
        : 'Interactive 3D preview');
      pane.emptyMsg.hidden = refs.length > 0;

      // A composite has fixed per-part colours — no filament swatch.
      pane.colorPicker.hidden = refs.length === 0 || refs.every(r => r.composite);

      pane.qrBtn.hidden = !(single && single.model.qr);
      pane.qrBtn.onclick = single && single.model.qr
        ? (e) => { e.stopPropagation(); showQrPopover(single.model.qr, single.name); }
        : null;
      if (single && single.model.qr) {
        pane.qrBtn.setAttribute('aria-label', `Show QR code for ${single.name}`);
      }

      // Info row: name / print time / description / links. Per-model detail
      // only makes sense when the pane holds exactly one model.
      pane.info.replaceChildren(pane.title);
      pane.title.textContent = refs.length === 0
        ? 'No model selected'
        : (single ? single.name : `${refs.length} models`);

      if (single) {
        if (single.model.estimated_minutes) {
          const t = document.createElement('span');
          t.className = 'print-time';
          t.textContent = `~${formatTime(single.model.estimated_minutes)}`;
          pane.info.appendChild(t);
        }

        const links = document.createElement('div');
        links.className = 'card-links';

        const dl = document.createElement('a');
        dl.href = single.stlUrl;
        dl.setAttribute('download', '');
        dl.setAttribute('aria-label', `Download STL for ${single.name}`);
        dl.textContent = 'Download STL';
        links.appendChild(dl);

        const sa = document.createElement('a');
        sa.href = `standalone/${encodeURI(single.model.stl.replace(/\.stl$/i, '.html'))}${cacheBust}`;
        sa.setAttribute('aria-label', `View standalone HTML viewer for ${single.name}`);
        sa.textContent = 'Standalone';
        links.appendChild(sa);

        if (single.model.source) {
          const src = document.createElement('a');
          src.href = publicSourceUrl(single.model.source);
          src.target = '_blank';
          src.rel = 'noopener noreferrer';
          src.setAttribute('aria-label', `View OpenSCAD source for ${single.name} on GitHub`);
          src.textContent = 'Source';
          links.appendChild(src);
        }

        pane.info.appendChild(links);

        if (single.projectData.description) {
          const det = document.createElement('details');
          det.className = 'pane-desc';
          const sum = document.createElement('summary');
          sum.textContent = 'Description';
          det.appendChild(sum);
          const p = document.createElement('p');
          p.textContent = single.projectData.description;
          det.appendChild(p);
          pane.info.appendChild(det);
        }

        if (Array.isArray(single.projectData.printing_notes)) {
          const notes = single.projectData.printing_notes.filter(n => typeof n === 'string' && n.trim());
          if (notes.length) {
            const det = document.createElement('details');
            det.className = 'printing-notes';
            const sum = document.createElement('summary');
            sum.textContent = 'Printing notes';
            det.appendChild(sum);
            const ul = document.createElement('ul');
            for (const n of notes) {
              const li = document.createElement('li');
              li.textContent = n;
              ul.appendChild(li);
            }
            det.appendChild(ul);
            pane.info.appendChild(det);
          }
        }
      }

      // In-browser parametric customizer — only present when the pane holds a
      // single model that ships a validated parameters manifest.
      if (single && single.model.parameters?.parameters?.length) {
        const customizer = buildCustomizer(pane, single);
        pane.controlsRow.insertBefore(customizer.button, pane.clipSlider);
        pane.controlsRow.insertAdjacentElement('afterend', customizer.panel);
        pane.customizerCleanup = customizer.destroy;
      }
    }

    async function setPaneModels(pane, refs) {
      pane.models = refs.slice();
      const token = ++pane.loadToken;

      if (pane.customizerCleanup) {
        pane.customizerCleanup();
        pane.customizerCleanup = null;
      }
      renderPaneChrome(pane);
      refreshTreeSelection();

      pane.crossBtn.disabled = true;
      pane.clipSlider.disabled = true;
      pane.controlsRow.querySelectorAll('.view-btn').forEach(b => { b.disabled = true; });

      if (!refs.length) {
        pane.viewer.clear(token);
        pane.clipBBox = null;
        updateHash();
        return;
      }

      const names = refs.map(r => r.name).join(', ');
      try {
        const bbox = await pane.viewer.setModels(
          refs.map(r => ({ stlUrl: r.stlUrl, composite: r.composite, viewerRotateX: r.viewerRotateX })), token);
        if (bbox === null) return;

        pane.clipBBox = bbox;
        pane.crossBtn.disabled = false;
        pane.clipSlider.disabled = false;
        pane.controlsRow.querySelectorAll('.view-btn').forEach(b => { b.disabled = false; });

        // The materials were rebuilt — re-apply the active clip plane and
        // re-anchor it to the new bounding box.
        if (pane.clipPlane) {
          const pct = Number(pane.clipSlider.value) / 100;
          pane.clipPlane.constant = bbox.minY + pct * (bbox.maxY - bbox.minY);
          for (const m of pane.viewer.materials) m.clippingPlanes = [pane.clipPlane];
          pane.viewer.invalidate();
        }
        pane.viewer.setFilamentColor(pane.selectedColor);
        updateHash();
        announce(`Loaded ${names} in pane ${pane.index + 1}`);
      } catch (err) {
        console.error('Failed to load model', err);
        if (token === pane.loadToken) pane.title.textContent = `Failed to load ${names}`;
      }
    }

    function setLayout(n) {
      const count = Math.min(3, Math.max(1, n));
      while (panes.length > count) {
        const pane = panes.pop();
        if (pane.customizerCleanup) pane.customizerCleanup();
        pane.viewer.dispose();
        pane.el.remove();
      }
      while (panes.length < count) {
        panes.push(createPane(panes.length));
      }
      panesEl.className = `panes panes--${count}`;
      for (const pane of panes) {
        pane.el.classList.remove('pane--focused');
        pane.focusBtn.setAttribute('aria-pressed', 'false');
      }
      if (activePane >= panes.length) activePane = panes.length - 1;
      setActivePane(activePane);
      for (const btn of layoutBtns) {
        btn.setAttribute('aria-pressed', String(Number(btn.dataset.layout) === count));
      }
      refreshTreeSelection();
      updateHash();
    }

    function onTreeModelActivate(ref, additive) {
      const pane = panes[activePane];
      if (!pane) return;
      if (additive) {
        if (pane.models.some(m => m.stlUrl === ref.stlUrl)) return;
        setPaneModels(pane, [...pane.models, ref]);
      } else {
        setPaneModels(pane, [ref]);
      }
      if (window.matchMedia('(max-width: 900px)').matches) {
        setSidebarOpen(false);
        pane.el.scrollIntoView({ block: 'nearest' });
      }
    }

    // ------------------------------------------------------------------
    // Customizer
    // ------------------------------------------------------------------

    // Install a customizer-rendered STL into the pane's viewer, replacing the
    // precomputed mesh.
    async function applyCustomGeometry(pane, stlUrl) {
      const geometry = await loadSTL(stlUrl);
      const bbox = pane.viewer.replaceGeometry(geometry);
      if (!bbox) return;
      pane.clipBBox = bbox;
      // Enable the cross-section/view controls if they're still waiting on the
      // default STL — the customized geometry is enough to drive them.
      pane.crossBtn.disabled = false;
      pane.clipSlider.disabled = false;
      pane.controlsRow.querySelectorAll('.view-btn').forEach(b => { b.disabled = false; });
      if (pane.clipPlane) {
        const pct = Number(pane.clipSlider.value) / 100;
        pane.clipPlane.constant = bbox.minY + pct * (bbox.maxY - bbox.minY);
      }
    }

    function buildCustomizer(pane, ref) {
      const { model, projectData, name: modelName } = ref;

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'customize-btn';
      button.textContent = '⚙ Customize';
      button.setAttribute('aria-label', `Customize ${modelName} parameters`);
      button.setAttribute('aria-pressed', 'false');

      const panel = document.createElement('div');
      panel.className = 'customizer-panel';

      const status = document.createElement('div');
      status.className = 'customizer-status';
      status.setAttribute('aria-live', 'polite');

      const downloadLink = document.createElement('a');
      downloadLink.className = 'customizer-download';
      downloadLink.hidden = true;
      downloadLink.download = model.stl.replace(/\.stl$/i, '') + '__custom.stl';
      downloadLink.textContent = '⬇ Download customized STL';

      // Re-render button + status share a row beneath the param list.
      const actions = document.createElement('div');
      actions.className = 'customizer-actions';
      const rerenderBtn = document.createElement('button');
      rerenderBtn.type = 'button';
      rerenderBtn.className = 'rerender-btn';
      rerenderBtn.textContent = '⟳ Re-render';
      rerenderBtn.setAttribute('aria-label', `Re-render ${modelName} with current parameters`);
      actions.appendChild(rerenderBtn);
      actions.appendChild(status);

      const paramValues = {};
      function markDirty(row) {
        if (row) row.classList.add('param-row--dirty');
        rerenderBtn.classList.add('dirty');
      }
      function clearDirty() {
        for (const r of panel.querySelectorAll('.param-row--dirty')) {
          r.classList.remove('param-row--dirty');
        }
        rerenderBtn.classList.remove('dirty');
      }

      for (const p of model.parameters.parameters) {
        const row = document.createElement('div');
        row.className = 'param-row';
        const label = document.createElement('label');
        label.textContent = p.label;
        // Ids must be unique across panes, otherwise a label in one pane
        // binds to the identically-named slider in another.
        const inputId = `param-${pane.index}-${ref.modelSlug}-${p.name}`;
        label.htmlFor = inputId;
        row.appendChild(label);
        if (p.type === 'number') {
          const input = document.createElement('input');
          input.type = 'range';
          input.id = inputId;
          input.min = String(p.min);
          input.max = String(p.max);
          input.step = String(p.step);
          input.value = String(p.default);
          const display = document.createElement('span');
          display.className = 'param-value';
          display.textContent = String(p.default);
          paramValues[p.name] = Number(p.default);
          input.addEventListener('input', () => {
            const v = Number(input.value);
            paramValues[p.name] = v;
            display.textContent = String(v);
            markDirty(row);
          });
          row.appendChild(input);
          row.appendChild(display);
        } else if (p.type === 'boolean') {
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.id = inputId;
          input.checked = Boolean(p.default);
          paramValues[p.name] = Boolean(p.default);
          input.addEventListener('change', () => {
            paramValues[p.name] = input.checked;
            markDirty(row);
          });
          row.appendChild(input);
        }
        panel.appendChild(row);
      }
      panel.appendChild(actions);
      panel.appendChild(downloadLink);

      let inFlight = false;

      async function runRender(initialLabel = 'Rendering…') {
        if (inFlight) return;
        inFlight = true;
        rerenderBtn.disabled = true;
        const renderedParams = { ...paramValues };
        status.classList.remove('error');
        status.textContent = initialLabel;
        const startMs = performance.now();
        let url;
        try {
          const sources = await loadProjectSources(projectData.dir);
          const entryName = model.source.split('/').pop();
          const stlBytes = await renderInWorker({
            sources: Array.from(sources.entries()),
            entry: entryName,
            params: { ...renderedParams },
            projectDir: projectData.dir,
          });
          const blob = new Blob([stlBytes], { type: 'model/stl' });
          url = URL.createObjectURL(blob);
          await applyCustomGeometry(pane, url);
          const prevHref = downloadLink.dataset.blobUrl;
          if (prevHref) URL.revokeObjectURL(prevHref);
          downloadLink.href = url;
          downloadLink.dataset.blobUrl = url;
          downloadLink.hidden = false;
          const ms = Math.round(performance.now() - startMs);
          status.textContent = `Rendered in ${(ms / 1000).toFixed(1)}s`;
          const stillMatch = Object.keys(renderedParams).every(k => paramValues[k] === renderedParams[k]);
          if (stillMatch) clearDirty();
        } catch (err) {
          if (url) URL.revokeObjectURL(url);
          console.error('Customizer render failed:', err);
          status.classList.add('error');
          status.textContent = `Error: ${err.message || err}`;
        } finally {
          inFlight = false;
          rerenderBtn.disabled = false;
        }
      }

      rerenderBtn.addEventListener('click', () => runRender());

      button.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        button.setAttribute('aria-pressed', String(open));
        if (open && downloadLink.hidden) {
          runRender('Loading initial preview…');
        }
      });

      function destroy() {
        const prevHref = downloadLink.dataset.blobUrl;
        if (prevHref) URL.revokeObjectURL(prevHref);
        button.remove();
        panel.remove();
      }

      return { button, panel, destroy };
    }

    // ------------------------------------------------------------------
    // Hash routing
    // ------------------------------------------------------------------

    // The multi-pane grammar is a strict superset of the historic
    // `#project/model` and `#project` forms: panes are separated by `+` and
    // models within a pane by `,`. Neither character (nor a second `/`) can
    // appear in a slug — the CI filename charset is `[A-Za-z0-9._ -]` and
    // slugify only maps `[_\s]+` to `-` — so every legacy link still parses
    // to exactly one pane holding one model, and round-trips byte-identically.
    // __HASH_ROUTING_START__
    function parseHash(raw) {
      if (!raw) return null;
