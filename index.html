      const spec = raw.split('+').map((paneStr) => paneStr.split(',').map((segment) => {
        let decoded;
        try {
          decoded = decodeURIComponent(segment);
        } catch (e) {
          decoded = segment;
        }
        const sep = decoded.indexOf('/');
        if (sep === -1) return { p: decoded, m: null };
        return { p: decoded.slice(0, sep), m: decoded.slice(sep + 1) };
      }).filter((entry) => entry.p)).filter((models) => models.length);
      return spec.length ? spec : null;
    }

    function formatHash(spec) {
      return spec
        .map((models) => models.map((entry) => (entry.m ? `${entry.p}/${entry.m}` : entry.p)).join(','))
        .filter(Boolean)
        .join('+');
    }
    // __HASH_ROUTING_END__

    // Incoming URLs are never rewritten: `updateHash()` stays inert until the
    // initial route has been fully applied, so arriving at `#toothbrush` from
    // the README leaves the address bar (and the Plausible hash pageview)
    // exactly as it was.
    let applyingHash = false;
    let lastWrittenHash = null;

    function currentSpec() {
      return panes.map(pane => pane.models.map(ref => ({ p: ref.projectSlug, m: ref.modelSlug })));
    }

    function updateHash() {
      if (applyingHash) return;
      const hash = formatHash(currentSpec());
      lastWrittenHash = hash;
      history.replaceState(null, '', hash
        ? `#${hash}`
        : window.location.pathname + window.location.search);
    }

    async function applyHash() {
      const spec = parseHash(window.location.hash.slice(1));
      if (!spec) return false;

      const resolved = spec
        .map(models => models.map(resolveRef).filter(Boolean))
        .filter(models => models.length);
      if (!resolved.length) {
        console.warn('No models matched hash', window.location.hash);
        return false;
      }

      setLayout(Math.min(resolved.length, 3));
      const used = resolved.slice(0, panes.length);
      await Promise.all(used.map((refs, i) => setPaneModels(panes[i], refs)));
      revealInTree(used[0][0]);
      return true;
    }

    // ------------------------------------------------------------------
    // Chrome wiring
    // ------------------------------------------------------------------

    function setSidebarOpen(open) {
      document.body.classList.toggle('sidebar-open', open);
      sidebarToggle.setAttribute('aria-expanded', String(open));
    }

    sidebarToggle.addEventListener('click', () => {
      setSidebarOpen(!document.body.classList.contains('sidebar-open'));
    });

    for (const btn of layoutBtns) {
      btn.addEventListener('click', () => setLayout(Number(btn.dataset.layout)));
    }

    addModeBtn.addEventListener('click', () => {
      const on = addModeBtn.getAttribute('aria-pressed') === 'true';
      addModeBtn.setAttribute('aria-pressed', String(!on));
    });

    document.addEventListener('keydown', (e) => {
      // Skip if typing in an input/textarea or if modifier keys are held
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;

      if (e.key === 'Escape') {
        if (document.fullscreenElement) return;
        const focused = panes.find(p => p.el.classList.contains('pane--focused'));
        if (focused) {
          e.preventDefault();
          toggleFocusPane(focused);
          return;
        }
        if (document.body.classList.contains('sidebar-open')) {
          e.preventDefault();
          setSidebarOpen(false);
        }
        return;
      }

      if (e.key === '/') {
        e.preventDefault();
        setSidebarOpen(true);
        filterInput.focus();
        return;
      }

      if (e.key === '1' || e.key === '2' || e.key === '3') {
        e.preventDefault();
        setLayout(Number(e.key));
        return;
      }

      const pane = panes[activePane];
      if (!pane) return;

      if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen(pane);
        return;
      }
      if (e.key === 'd' || e.key === 'D') {
        const dl = pane.el.querySelector('.chip-dl');
        if (dl) {
          e.preventDefault();
          dl.click();
        }
        return;
      }
      if (e.key === 'c' || e.key === 'C') {
        if (pane.crossBtn.disabled) return;
        e.preventDefault();
        pane.crossBtn.click();
        return;
      }
      if (e.key === 'm' || e.key === 'M') {
        if (document.fullscreenElement) return;
        e.preventDefault();
        toggleFocusPane(pane);
        return;
      }
      if (e.key === 'r' || e.key === 'R') {
        const btn = pane.el.querySelector('.rerender-btn');
        if (btn && !btn.disabled) {
          e.preventDefault();
          btn.click();
        }
      }
    });

    // Pause every viewer's animation loop while the tab is hidden.
    document.addEventListener('visibilitychange', () => {
      for (const pane of panes) {
        if (document.hidden) pane.viewer.stop();
        else pane.viewer.start();
      }
    });

    window.addEventListener('hashchange', () => {
      if (window.location.hash.slice(1) === lastWrittenHash) return;
      applyingHash = true;
      applyHash()
        .catch(err => console.warn('Failed to apply hash route', err))
        .finally(() => { applyingHash = false; });
    });

    async function init() {
      let models;
      try {
        const [modelsResp, colorsResp] = await Promise.all([
          fetch(`models.json${cacheBust}`),
          fetch(`filament-colors.json${cacheBust}`),
        ]);
        if (!modelsResp.ok) throw new Error(modelsResp.status);
        if (!colorsResp.ok) throw new Error(colorsResp.status);
        models = await modelsResp.json();
        FILAMENT_COLORS = (await colorsResp.json()).map(c => {
          if (!/^[0-9a-fA-F]{6}$/.test(c.hex)) throw new Error(`Invalid hex value for color "${c.name}": "${c.hex}"`);
          const hex = parseInt(c.hex, 16);
          return { name: c.name, hex };
        });
      } catch (e) {
        console.error(e);
        const failed = document.createElement('div');
        failed.className = 'loading';
        failed.textContent = 'Failed to load models';
        panesEl.replaceChildren(failed);
        return;
      }

      // In PR previews, changed.json lists projects with modified models.
      // On the main site it won't exist.
      let changedProjects = null;
      try {
        const changedResp = await fetch(`changed.json${cacheBust}`);
        if (changedResp.ok) changedProjects = await changedResp.json();
      } catch (e) { /* main site — no preview hints */ }

      MODEL_INDEX = buildModelIndex(models);
      buildTree(models);
      panesEl.replaceChildren();

      // Hold hash writes until the initial route has settled so an incoming
      // URL survives verbatim.
      applyingHash = true;
      setLayout(1);
      let routed = false;
      if (window.location.hash.slice(1)) {
        try {
          routed = await applyHash();
        } catch (err) {
          console.warn('Failed to apply hash route', err);
        }
      }
      applyingHash = false;

      if (routed) {
        lastWrittenHash = window.location.hash.slice(1);
        return;
      }

      let firstRef = null;
      if (changedProjects && changedProjects.length) {
        for (const name of changedProjects) {
          const node = projectNodes.get(slugify(name));
          if (node) setExpanded(node, true);
        }
        for (const name of changedProjects) {
          const ref = MODEL_INDEX.find(r => r.projectName === name);
          if (ref) { firstRef = ref; break; }
        }
      }
      if (!firstRef) firstRef = MODEL_INDEX[0] || null;
      if (firstRef) {
        revealInTree(firstRef);
        await setPaneModels(panes[0], [firstRef]);
      }
    }

    init();
  </script>
</body>
</html>
