name: Build Models

on:
  push:
    # claws/preview-issue-<id> branches are PR-less issue-planning previews
    # pushed by scripts/request-issue-preview.sh; they deploy to
    # issue-preview/<id>/<sha8>/ (see docs/ci-pipeline.md, "Issue previews").
    branches: [main, 'claws/preview-issue-*']
    paths-ignore:
      - 'docs/**'
      - 'ideas/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - 'ideas/**'
      - '*.md'
      - 'LICENSE'

permissions:
  # write needed at workflow scope for gallery commit on main pushes;
  # acceptable trade-off for a single-job workflow on a self-hosted runner.
  contents: write
  pull-requests: write
  id-token: write

# Forgejo ignores `permissions: id-token: write` above (kept harmless) and
# only exposes ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN when this is set; without
# it configure-aws-credentials finds no OIDC env vars and fails. Tokens are
# issued by https://www.bstjohn.net/forgejo-oidc (docs/ci-pipeline.md,
# "Forgejo cutover").
enable-openid-connect: true

concurrency:
  # Issue-preview pushes get their own group
  # (pages-refs/heads/claws/preview-issue-<id>, the full ref) so they never
  # cancel a main build; pr-preview-cleanup.yml rebuilds the same string from
  # a delete event's ref whichever form Forgejo sends, so a delete cancels an
  # in-flight render before the prefix is removed.
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (startsWith(github.ref, 'refs/heads/claws/preview-issue-') && github.ref) || 'main' }}
  cancel-in-progress: true

# This workflow runs on Forgejo Actions (git.home.bstjohn.net). The Linux
# runners are in-cluster dind pods (forgejo-runner on k3s, -ryzen, -nas,
# defined in St-John-Software/fleet-infra apps/forgejo-runner/), and every
# job gets a fresh job container: $HOME and the nix store start cold, so
# each run downloads the devShell closure afresh and the render cache is
# fetched per key from S3 (see "Render STL files"). systemd-run does
# not exist in the job container, so scripts/capped-openscad.sh falls back
# to `ulimit -v` + `timeout` (with a warning) — accepted.
#
# Every tool this workflow shells out to — openscad (EGL-headless wrapper),
# admesh, python3, node, imagemagick, zip, qrencode, aws — comes from this
# repo's own flake.nix via `nix develop`. Do NOT add actions/setup-node,
# actions/setup-python, sudo/apt-get, or ask for packages on the runner
# itself; add tools to flake.nix instead. Remote actions are full
# `https://github.com/...@<sha> # vX.Y.Z` URLs; Forgejo resolves the local
# ./.github/actions/setup-nix composite action by path.
env:
  # Memory/time caps for capped-openscad.sh STL renders (issue #272).
  # Thumbnail/orthographic-view steps override these lower via step-level env.
  #
  # DELIBERATE VALUES — do not lower without checking the heaviest models:
  # the full-res (512 px) nz-ski-fields part renders. The #248 merge build
  # spent 56 min cold-rendering the three parts, and the full-res assembly
  # variant measured 31 min / >8G peak on the ryzen runner (32 GB) before it
  # moved to a 128 px preview heightmap (#271). 28G is cgroup-enforced by
  # capped-openscad.sh, so a runaway render still fails cleanly without
  # freezing the host. Renders are cached, so the full cost only recurs when
  # a heavy .scad source (or the OpenSCAD version) changes. This cap is a
  # hard ceiling every runner the job lands on must comfortably exceed, not
  # a calibration to one known box (see the runs-on comment below).
  RENDER_MEM_MAX: 28G
  RENDER_TIMEOUT: "3600"
  # Self-hosted runner units export the nix-ld library dir as LD_LIBRARY_PATH
  # (for pip-installed wheels). It beats nix RUNPATH, so host libs built
  # against a newer glibc get loaded into this flake's binaries (run
  # 37439885318: "GLIBC_2.43 not found"). This repo takes every Python dep
  # from nixpkgs and needs no such path; an empty value is ignored by ld.so.
  LD_LIBRARY_PATH: ""

jobs:
  build:
    # `beefy` keeps this job off the small k3s runner pod (4Gi dind limit),
    # which a heavy render would OOM. Only the ryzen and nas runner pods
    # carry it, so the job queues while both boxes are off — the same
    # runner set as the GitHub era. fleet-infra sizes their dind containers
    # at 28Gi (ryzen) and 32Gi (nas) to clear RENDER_MEM_MAX, and sets the
    # beefy runners' runner.timeout to 3h: a fully cold render exceeds 1h.
    # Nothing else here is host-specific (no GPU; the render cache lives in
    # S3). See docs/ci-pipeline.md for the full rationale.
    runs-on: [self-hosted, linux, beefy]

    # Every run step executes inside the flake's default devShell. The job
    # therefore starts with checkout + setup-nix, and the first devShell
    # entry downloads the toolchain closure into the job container's cold
    # nix store (every run, until a LAN nix cache exists).
    #
    # The shell below adds `-u` (nounset) at the job level: every step's
    # `run:` block must be nounset-safe (guard optional vars with
    # `${VAR:-}`), since referencing an unset variable now hard-fails instead
    # of silently expanding to empty.
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#default --command bash -euo pipefail {0}

    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: scripts/project_dates.py reads each project dir's
          # last-commit date for landing-page recency ordering (#345).
          fetch-depth: 0

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      # Early, so the render loop can read and write the S3 render cache.
      # Best-effort: the cache is only an optimisation, so a broken role or
      # trust policy must not cost a PR its render, validation and preview.
      # On failure the render loop runs with the local cache alone
      # (RENDER_CACHE_S3=0) and "Refresh AWS credentials" fails the run
      # loudly before the deploys. Default one-hour session: once it lapses
      # mid-render, per-miss uploads just warn and the next run resumes.
      - name: Configure AWS credentials
        id: aws_creds
        continue-on-error: true
        uses: https://github.com/aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: forgejo-actions-${{ github.run_id }}

      - name: Resolve issue preview target
        id: issue_preview
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claws/preview-issue-')
        run: |
          ISSUE_ID="${GITHUB_REF_NAME#claws/preview-issue-}"
          if ! [[ "$ISSUE_ID" =~ ^([0-9]+|clw_[A-Za-z0-9]+)$ ]]; then
            echo "::error::'$ISSUE_ID' is not a valid issue id (expected digits or clw_<alnum>)"
            exit 1
          fi
          {
            echo "issue_id=$ISSUE_ID"
            echo "short_sha=${GITHUB_SHA::8}"
            echo "enabled=true"
          } >> "$GITHUB_OUTPUT"
          echo "Issue preview for $ISSUE_ID at ${GITHUB_SHA::8}"

      - name: Verify dependency graphs are up-to-date
        id: depgraph
        run: |
          bash scripts/scad-dep-graph.sh
          if ! git diff --quiet -- '*/dependency-graph.md'; then
            echo "::warning::Dependency graphs are out of date. Run: bash scripts/scad-dep-graph.sh"
            git diff -- '*/dependency-graph.md'
            git checkout -- '*/dependency-graph.md'
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate project metadata
        id: metadata
        run: |
          python3 -c "
          import json, glob, os, sys
          from jsonschema import validate, ValidationError

          with open('meta.schema.json') as f:
              schema = json.load(f)

          files = sorted(glob.glob('*/meta.json'))
          if not files:
              print('No meta.json files found — skipping validation')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('failed=false\n')
              sys.exit(0)

          errors = 0
          failed_paths = []
          for path in files:
              try:
                  with open(path) as f:
                      data = json.load(f)
              except json.JSONDecodeError as e:
                  print(f'  FAIL: {path} — invalid JSON: {e}')
                  errors += 1
                  failed_paths.append(path)
                  continue
              try:
                  validate(instance=data, schema=schema)
              except ValidationError as e:
                  print(f'  FAIL: {path} — {e.message}')
                  errors += 1
                  failed_paths.append(path)
                  continue
              hero = data.get('hero')
              if hero is not None:
                  src = os.path.join(os.path.dirname(path), hero[:-4] + '.scad')
                  if os.path.basename(src).startswith('_') or not os.path.isfile(src):
                      print(f'  FAIL: {path} — hero {hero!r} has no renderable source at {src}')
                      errors += 1
                      failed_paths.append(path)
                      continue
              print(f'  PASS: {path}')

          # Write failed paths so downstream steps can skip invalid meta.json files
          with open('.meta-failures', 'w') as f:
              f.write('\n'.join(failed_paths))

          if errors:
              print(f'::warning::{errors} meta.json file(s) failed schema validation')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'failed={str(bool(errors)).lower()}\n')
          "

      - name: Validate parameters manifests
        id: param_meta
        run: |
          python3 -c "
          import glob, json, os, sys
          from jsonschema import validate, ValidationError

          sys.path.insert(0, 'scripts')
          from external_assets import external_assets_for

          with open('parameters.schema.json') as f:
              schema = json.load(f)

          # Always create the file so the enforce step's check is honest,
          # even when no manifests exist yet.
          with open('.param-failures', 'w'):
              pass

          files = sorted(glob.glob('*/*.parameters.json'))
          if not files:
              print('No parameters.json files found — skipping validation')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('failed=false\n')
              sys.exit(0)

          errors = 0
          failed_paths = []
          for path in files:
              try:
                  with open(path) as f:
                      data = json.load(f)
              except json.JSONDecodeError as e:
                  print(f'  FAIL: {path} — invalid JSON: {e}')
                  errors += 1
                  failed_paths.append(path)
                  continue
              try:
                  validate(instance=data, schema=schema)
              except ValidationError as e:
                  print(f'  FAIL: {path} — {e.message}')
                  errors += 1
                  failed_paths.append(path)
                  continue
              # Cross-validation: default must be within [min, max] for number params.
              bounds_ok = True
              for param in data['parameters']:
                  if param.get('type') == 'number':
                      pmin = param['min']
                      pmax = param['max']
                      pdef = param['default']
                      if pmax < pmin:
                          pname = param['name']
                          print(f'  FAIL: {path} — parameter {pname!r}: max ({pmax}) < min ({pmin})')
                          errors += 1
                          failed_paths.append(path)
                          bounds_ok = False
                          break
                      if not (pmin <= pdef <= pmax):
                          pname = param['name']
                          print(f'  FAIL: {path} — parameter {pname!r}: default {pdef} is outside [{pmin}, {pmax}]')
                          errors += 1
                          failed_paths.append(path)
                          bounds_ok = False
                          break
              if not bounds_ok:
                  continue
              # Cross-validation: manifest must sit next to a renderable .scad.
              project_dir, fname = os.path.split(path)
              basename = fname[:-len('.parameters.json')]
              if basename.startswith('_'):
                  print(f'  FAIL: {path} — library files (_*.scad) cannot have parameter manifests')
                  errors += 1
                  failed_paths.append(path)
                  continue
              scad_path = os.path.join(project_dir, basename + '.scad')
              if not os.path.isfile(scad_path):
                  print(f'  FAIL: {path} — no matching renderable .scad found at {scad_path}')
                  errors += 1
                  failed_paths.append(path)
                  continue
              # Cross-validation: a renderable that pulls in an asset from
              # outside its project dir (e.g. a scans/ reference mesh, #439)
              # cannot be customized in the browser — the wasm FS is written
              # flat from the project's own files, so ../scans/... does not
              # resolve there. Refuse the combination rather than ship a
              # customizer that 404s. Scoped to this manifest's own
              # renderable — a scan-importing sibling must not disable the
              # customizer for the rest of the project.
              ext = external_assets_for(scad_path, project_dir)
              if ext:
                  print(f'  FAIL: {path} — {scad_path} imports {ext} from outside {project_dir}; '
                        f'the in-browser customizer cannot resolve external assets, so a model '
                        f'importing a scan reference mesh must not ship a parameters manifest')
                  errors += 1
                  failed_paths.append(path)
                  continue
              print(f'  PASS: {path}')

          with open('.param-failures', 'w') as f:
              f.write('\n'.join(failed_paths))

          if errors:
              print(f'::warning::{errors} parameters.json file(s) failed validation')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'failed={str(bool(errors)).lower()}\n')
          "

      - name: Run Python unit tests for build scripts
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # The flake's `openscad` is a wrapper around openscad-unstable that
      # forces the EGL/llvmpipe software-GL path (QT_QPA_PLATFORM=offscreen,
      # DISPLAY unset) — no Xvfb, no X server, no NVIDIA EGL stack involved.
      # This replaces the old "Prepare Xvfb environment" step and its lock
      # file / EGL-vendor-pinning workarounds (issues #361;
      # St-John-Software/nixos-config#110, #111).
      - name: Verify headless OpenSCAD rendering
        id: gl_smoke
        continue-on-error: true
        env:
          RENDER_MEM_MAX: 4G
          RENDER_TIMEOUT: "120"
        run: |
          printf 'cube(10);\n' > "$RUNNER_TEMP/glsmoke.scad"
          rm -f "$RUNNER_TEMP/glsmoke.png"
          bash "$GITHUB_WORKSPACE/scripts/capped-openscad.sh" \
            -o "$RUNNER_TEMP/glsmoke.png" --imgsize=64,48 \
            "$RUNNER_TEMP/glsmoke.scad" || true
          ok=false
          if [ -s "$RUNNER_TEMP/glsmoke.png" ] \
             && [ "$(od -An -tx1 -N8 "$RUNNER_TEMP/glsmoke.png" | tr -d ' \n')" = "89504e470d0a1a0a" ]; then
            ok=true
          fi
          if [ "$ok" = true ]; then
            echo "Headless OpenSCAD PNG rendering works (EGL offscreen via the flake's openscad wrapper)."
          else
            echo "::warning::Headless OpenSCAD PNG rendering is broken — the flake's openscad wrapper could not produce a PNG, so every thumbnail render below will fail too. Check the openscadHeadless wrapper in flake.nix."
          fi
          echo "headless_gl=$ok" >> "$GITHUB_OUTPUT"

      - name: Check OpenSCAD version
        id: scad_version
        run: |
          mkdir -p site
          if ! command -v openscad > /dev/null; then
            echo "::error::openscad not found on PATH — the flake devShell did not provide it"
            exit 1
          fi
          rc=0
          VERSION_OUTPUT="$(openscad --version 2>&1)" || rc=$?
          if [ "$rc" -ne 0 ] || [ -z "$VERSION_OUTPUT" ]; then
            echo "::error::'openscad --version' failed (exit $rc) — the flake's openscad cannot start, so nothing below can render"
            echo "openscad resolved to: $(command -v openscad)"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<unset>}"
            printf '%s\n' "$VERSION_OUTPUT"
            exit 1
          fi
          CURRENT_VERSION="${VERSION_OUTPUT%%$'\n'*}"
          echo "Current OpenSCAD version: $CURRENT_VERSION"
          echo "$CURRENT_VERSION" > site/openscad-version.txt

          STORED_VERSION=""
          if [ -f .openscad-version ]; then
            STORED_VERSION="$(cat .openscad-version)"
            STORED_VERSION="${STORED_VERSION%%$'\r'*}"
          fi

          if [ "$CURRENT_VERSION" != "$STORED_VERSION" ]; then
            echo "::warning::OpenSCAD version changed: '$STORED_VERSION' -> '$CURRENT_VERSION'. Update .openscad-version and expect a full re-render."
          else
            echo "OpenSCAD version matches stored value ($CURRENT_VERSION)"
          fi

      - name: Render STL files
        env:
          RENDER_CACHE_S3: ${{ steps.aws_creds.outcome == 'success' && '1' || '0' }}
          # Only main pushes write render-cache/, the prefix main deploys
          # hits from; PR and issue-preview runs write render-cache-pr/,
          # which main never reads, so an unmerged branch cannot plant an
          # STL that production ships.
          RENDER_CACHE_WRITE_PREFIX: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'render-cache' || 'render-cache-pr' }}
        run: |
          mkdir -p site
          > site/.scad-map
          OPENSCAD_VERSION="$(cat site/openscad-version.txt)"
          CACHE_DIR="${RENDER_CACHE_DIR:-$HOME/.cache/3d-models/render}"
          mkdir -p "$CACHE_DIR"
          S3_CACHE="s3://www.bstjohn.net/3d-models"
          # Main reads only its own prefix; other runs fall back to theirs.
          read_prefixes="render-cache"
          if [ "$RENDER_CACHE_WRITE_PREFIX" != "render-cache" ]; then
            read_prefixes="render-cache $RENDER_CACHE_WRITE_PREFIX"
          fi
          if [ "$RENDER_CACHE_S3" != "1" ]; then
            echo "::warning::AWS credentials unavailable — S3 render cache disabled, rendering from the local cache only"
          fi
          find . -name '*.scad' -not -path './.github/*' | while read -r file; do
            name="$(basename "$file" .scad)"
            name_re='^[A-Za-z0-9._ -]+$'
            if [[ ! "$name" =~ $name_re ]]; then
              echo "::error::Refusing to render $file: filename contains characters outside [A-Za-z0-9._ -]"
              exit 1
            fi
            # Skip library files (underscore-prefixed by convention)
            if [[ "$(basename "$file")" == _* ]]; then
              echo "  Skipping $file (library, underscore-prefixed)"
              continue
            fi
            dir="$(dirname "$file" | sed 's|^\./||' | cut -d/ -f1)"
            src="$(echo "$file" | sed 's|^\./||')"
            key="$(python3 scripts/render_cache.py key "$file" --openscad-version "$OPENSCAD_VERSION")"
            cached="$CACHE_DIR/$key.stl"
            # Job containers start with an empty $HOME, so a local miss is
            # looked up in the S3 render cache — fetching only the keys this
            # tree needs. A failed fetch only costs a render.
            if [ "$RENDER_CACHE_S3" = "1" ] && [ "${RENDER_CACHE_DISABLED:-}" != "1" ] && [ ! -s "$cached" ]; then
              for prefix in $read_prefixes; do
                if aws s3 cp "$S3_CACHE/$prefix/$key.stl" "$cached.tmp.$$" --only-show-errors < /dev/null 2>"$cached.err.$$" \
                   && [ -s "$cached.tmp.$$" ]; then
                  mv "$cached.tmp.$$" "$cached"
                  break
                fi
                if [ -z "${CACHE_FETCH_WARNED:-}" ] && [ -s "$cached.err.$$" ] \
                   && ! grep -qiE '404|Not Found' "$cached.err.$$"; then
                  echo "::warning::Render cache fetch failed (not a miss): $(head -c 300 "$cached.err.$$")"
                  CACHE_FETCH_WARNED=1
                fi
                rm -f "$cached.tmp.$$"
              done
              rm -f "$cached.err.$$"
            fi
            if [ "${RENDER_CACHE_DISABLED:-}" != "1" ] && [ -s "$cached" ]; then
              echo "  Cache HIT: $file ($key)"
              cp "$cached" "site/$name.stl"
              touch "$cached"   # refresh mtime so the prune keeps active entries
              echo "$name.stl	$dir	$src" >> site/.scad-map
              continue
            fi
            echo "Rendering: $file -> site/$name.stl (cache MISS $key)"
            # --backend=CGAL: openscad-unstable's default Manifold backend
            # emits zero-area (degenerate) facets for the drawer baseplate
            # grids — 112 per model, which fails admesh validation. CGAL is
            # the backend the 2021.01 renders used and produces clean meshes;
            # PNG previews below don't full-render, so only STL export needs
            # the flag.
            # Log goes to $RUNNER_TEMP (per-job, not shared) — /tmp is
            # world-writable on the shared self-hosted runners, and the
            # "library, no top-level geometry" branch below trusts this
            # file's contents (issue #424).
            bash "$GITHUB_WORKSPACE/scripts/capped-openscad.sh" --backend=CGAL --export-format binstl -o "site/$name.stl" "$file" > "$RUNNER_TEMP/scad.log" 2>&1 && rc=0 || rc=$?
            cat "$RUNNER_TEMP/scad.log"
            if [ "$rc" -eq 124 ] || [ "$rc" -ge 128 ]; then
              echo "::error::render exceeded memory/time cap: $file (rc=$rc)"
              rm -f "site/$name.stl"
              exit 1
            elif grep -qiE 'top level object is empty|nothing to export' "$RUNNER_TEMP/scad.log"; then
              echo "  Skipping $file (library, no top-level geometry)"
              rm -f "site/$name.stl"
            elif [ $rc -ne 0 ] && { [ ! -s "site/$name.stl" ] || [ "$(stat -c%s "site/$name.stl" 2>/dev/null || echo 0)" -le 84 ]; }; then
              echo "::warning::$file exited $rc with no geometry — skipping (suspected library)"
              rm -f "site/$name.stl"
            elif [ $rc -ne 0 ]; then
              echo "  ERROR rendering $file"
              exit 1
            else
              # Record mapping: stl-name → project-dir → source-path
              echo "$name.stl	$dir	$src" >> site/.scad-map
              # Populate the cache atomically so a concurrent build never reads
              # a half-written STL, then upload it straight away so a run that
              # times out mid-way through a cold render still leaves progress
              # in S3 for the next one.
              if [ "${RENDER_CACHE_DISABLED:-}" != "1" ]; then
                cp "site/$name.stl" "$cached.tmp.$$" && mv "$cached.tmp.$$" "$cached"
                if [ "$RENDER_CACHE_S3" = "1" ]; then
                  aws s3 cp "$cached" "$S3_CACHE/$RENDER_CACHE_WRITE_PREFIX/$key.stl" --only-show-errors < /dev/null \
                    || echo "::warning::render-cache upload failed for $key"
                fi
              fi
            fi
          done
          # Bound cache growth: drop entries not touched in 30 days.
          find "$CACHE_DIR" -maxdepth 1 -name '*.stl' -type f -mtime +30 -delete 2>/dev/null || true

      - name: Validate STL meshes
        id: validate
        run: |
          python3 scripts/validate_stl_meshes.py --site-dir site --output site/validation.json

      - name: Vendor Three.js runtime
        run: python3 scripts/fetch_threejs.py

      - name: Bundle openscad-wasm and sources for in-browser customizer
        run: |
          python3 scripts/fetch_openscad_wasm.py

          # Source .scad files are already public on GitHub; staging them
          # under site/sources/ lets the in-browser customizer fetch them
          # so openscad-wasm can resolve `include <...>` at render time.
          find . -name '*.scad' \
            -not -path './.github/*' \
            -not -path './site/*' \
            -not -path './.cache/*' \
            | while read -r f; do
              rel="${f#./}"
              mkdir -p "site/sources/$(dirname "$rel")"
              cp "$f" "site/sources/$rel"
            done

          # Parameter manifests that passed validation also go to S3 so the
          # browser can fetch them. Skip ones in .param-failures.
          if [ -s .param-failures ]; then
            mapfile -t failed_params < .param-failures
          else
            failed_params=()
          fi
          find . -name '*.parameters.json' \
            -not -path './site/*' \
            -not -path './.cache/*' \
            | while read -r f; do
              rel="${f#./}"
              skip=0
              for failed in "${failed_params[@]}"; do
                [ "$rel" = "$failed" ] && skip=1 && break
              done
              [ $skip -eq 1 ] && continue
              mkdir -p "site/sources/$(dirname "$rel")"
              cp "$f" "site/sources/$rel"
            done

          # Binary render assets (e.g. surface() heightmaps) referenced by a
          # sibling .scad must also be staged so the in-browser customizer can
          # write them into the wasm FS. Match by basename appearing in a .scad
          # in the same directory so unrelated images (screenshots) aren't staged.
          find . -name '*.png' \
            -not -path './.github/*' \
            -not -path './site/*' \
            -not -path './.cache/*' \
            | while read -r f; do
              dir="$(dirname "$f")"
              bn="$(basename "$f")"
              if grep -qF "$bn" "$dir"/*.scad 2>/dev/null; then
                rel="${f#./}"
                mkdir -p "site/sources/$(dirname "$rel")"
                cp "$f" "site/sources/$rel"
              fi
            done

          # Per-project file listings so the browser can discover library
          # files (S3 doesn't serve directory indexes).
          for dir in site/sources/*/; do
            [ -d "$dir" ] || continue
            python3 -c "
          import json, os, sys
          d = sys.argv[1]
          scads = sorted(f for f in os.listdir(d) if f.endswith('.scad') or f.endswith('.png'))
          with open(os.path.join(d, 'manifest.json'), 'w') as out:
              json.dump(scads, out)
          " "$dir"
          done

      # node comes from the flake devShell (this replaces the old
      # actions/setup-node + relocate-to-$RUNNER_TEMP dance from issue #356 —
      # setup-node's prebuilt tarball and the runner tool cache are both
      # unusable on the NixOS runners).
      - name: Smoke-test WASM customizer rendering
        run: |
          node scripts/test_wasm_customizer.mjs
          node scripts/test_hash_routing.mjs
          node scripts/test_landing_order.mjs
          node scripts/test_hash_history.mjs

      - name: Check mating part interference
        id: interference
        run: |
          python3 -m unittest discover -s scripts -p "test_check_interference.py" -v
          python3 scripts/check_interference.py

      - name: Generate standalone HTML viewers
        run: python3 scripts/generate-standalone.py

      - name: Bundle project zips
        run: |
          declare -A project_files
          while IFS=$'\t' read -r stl dir src; do
            project_files[$dir]+="site/$stl"$'\n'
          done < site/.scad-map

          for dir in "${!project_files[@]}"; do
            mapfile -t files < <(printf '%s' "${project_files[$dir]}")
            if [ ${#files[@]} -ge 2 ]; then
              zipname="site/${dir}.zip"
              echo "Bundling ${#files[@]} files into $zipname"
              zip -j "$zipname" "${files[@]}" || { echo "::error::Failed to create $zipname"; exit 1; }
            else
              echo "Skipping $dir (only ${#files[@]} file)"
            fi
          done

      - name: Bundle project source zips
        run: |
          mapfile -t dirs < <(cut -f2 site/.scad-map | sort -u)
          for dir in "${dirs[@]}"; do
            [ -d "$dir" ] || continue
            zipname="site/${dir}-source.zip"
            echo "Bundling source for $dir into $zipname"
            git ls-files -z -- "$dir" | xargs -0 -r zip -q "$zipname" \
              || { echo "::error::Failed to create $zipname"; exit 1; }
            # Assets imported from outside the project (a scans/ reference
            # mesh, #439) are not in git ls-files for $dir, and a source zip
            # without them cannot be re-rendered.
            mapfile -t extra < <(python3 scripts/external_assets.py "$dir")
            if [ ${#extra[@]} -gt 0 ]; then
              echo "  + external assets: ${extra[*]}"
              printf '%s\0' "${extra[@]}" | xargs -0 -r zip -q "$zipname" \
                || { echo "::error::Failed to add external assets to $zipname"; exit 1; }
            fi
          done

      # No Xvfb: the flake's openscad wrapper renders PNGs offscreen via
      # EGL/llvmpipe, so the old xvfb-run retry/lock-cleanup machinery is gone.
      #
      # OpenSCAD exits 0 after "Cannot create OpenGL OffscreenView" but leaves
      # a 0-byte file behind, and a 0-byte PNG syncs to S3 just as happily as
      # a real one (issue #359: every thumbnail on the live site was empty, so
      # the landing gallery rendered as bare text). Only a file starting with
      # the 8-byte PNG signature counts as rendered — same check as the
      # gl_smoke probe above. Failures are recorded here; they skip the S3
      # deploy (steps.thumbnails.outputs.failed is one of the conjuncts on
      # the "Deploy to S3 (main)" if:) and hard-fail the build in the
      # "Enforce thumbnail rendering" step at the end — the same deferred
      # enforcement shape as mesh/metadata/interference/parameters. Skipping
      # the deploy matters because a broken PNG is deleted above and the sync
      # runs with --delete, so deploying would strip the last good thumbnails
      # off the live site (issue #359).
      - name: Render PNG thumbnails
        id: thumbnails
        env:
          RENDER_MEM_MAX: 4G
          RENDER_TIMEOUT: "120"
        run: |
          valid_png() {
            [ -s "$1" ] || return 1
            [ "$(od -An -tx1 -N8 "$1" | tr -d ' \n')" = "89504e470d0a1a0a" ]
          }
          : > .thumb-failures
          while IFS="$(printf "\t")" read -r stl dir src; do
            name="${stl%.stl}"
            echo "Rendering thumbnail: $src -> site/$name.png"
            bash "$GITHUB_WORKSPACE/scripts/capped-openscad.sh" -o "site/$name.png" --imgsize=800,600 "$src" \
              || echo "::warning::Failed to render thumbnail for $name"
            if ! valid_png "site/$name.png"; then
              echo "::warning::No valid PNG produced for $name"
              rm -f "site/$name.png"
              printf '%s\n' "$name" >> .thumb-failures
            fi
          done < site/.scad-map

          expected=$(grep -c . site/.scad-map || true)
          n=$(grep -c . .thumb-failures || true)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::warning::${n} of ${expected} models produced no valid PNG thumbnail"
            cat .thumb-failures
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "All ${expected} thumbnails rendered."
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render extra orthographic views for complex-interior models
        env:
          RENDER_MEM_MAX: 4G
          RENDER_TIMEOUT: "120"
        run: |
          cat > "$RUNNER_TEMP/render-interior-views.sh" << 'SCRIPT'
          while IFS="$(printf "\t")" read -r stl dir src; do
            if [ ! -f "$dir/meta.json" ]; then
              continue
            fi
            if ! python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get('complex_interior') else 1)" "$dir/meta.json" 2>/dev/null; then
              continue
            fi
            name="${stl%.stl}"
            echo "Rendering orthographic views for $src (complex_interior=true)"
            for spec in "top:0,0,0,0,0,0,500:ortho" "bottom:0,0,0,180,0,0,500:ortho" "front:0,0,0,90,0,0,500:ortho"; do
              view="${spec%%:*}"; rest="${spec#*:}"; cam="${rest%%:*}"; proj="${rest##*:}"
              out="site/${name}_${view}.png"
              echo "  $view -> $out"
              if bash "$GITHUB_WORKSPACE/scripts/capped-openscad.sh" -o "$out" --imgsize=800,600 \
                --camera="$cam" --projection="$proj" --viewall --autocenter "$src"; then
                # Guard against OpenSCAD exiting 0 but writing an empty/corrupt file
                if [ ! -s "$out" ]; then
                  echo "::warning::Empty PNG for $view view of $name — removing"
                  rm -f "$out"
                fi
              else
                echo "::warning::Failed to render $view view for $name"
                rm -f "$out"
              fi
            done
          done < site/.scad-map
          SCRIPT

          bash "$RUNNER_TEMP/render-interior-views.sh"

      - name: Generate QR codes
        run: |
          mkdir -p site/qr
          # Slugs come from the canonical slugify() in scripts/oembed_helpers.py
          # (the same one index.html, embed.html and generate-gallery.py use).
          # There is deliberately no Bash re-derivation here: a shell copy has
          # no parity test and would silently drift (issue #398).
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from scripts.oembed_helpers import slugify, parse_scad_map, BASE_URL

          scad_map = parse_scad_map('site/.scad-map')
          with open(sys.argv[1], 'w') as out:
              for stl, info in sorted(scad_map.items()):
                  name = stl[:-4] if stl.endswith('.stl') else stl
                  url = BASE_URL + '/#' + slugify(info['dir']) + '/' + slugify(stl)
                  out.write(name + '\t' + url + '\n')
          " "$RUNNER_TEMP/qr-urls.tsv"

          while IFS="$(printf '\t')" read -r name url; do
            echo "QR: $url -> site/qr/${name}.png"
            qrencode -o "site/qr/${name}.png" -s 8 -m 2 \
              --foreground=E0E0E0 --background=1A1A2E \
              "$url" \
              || echo "::warning::Failed to generate QR for $name"
          done < "$RUNNER_TEMP/qr-urls.tsv"

      - name: Generate OG hero image
        run: |
          # ImageMagick from the flake ships no default font (no distro
          # type.xml), so ANY text-capable operation fails with
          #   "unable to read font `(null)'"  --  including montage, which
          # labels each tile by default. `+label` does not suppress the lookup;
          # MAGICK_FONT and a hand-supplied type.xml are both ignored. Naming a
          # font explicitly is the only fix that works (issue #352).
          # Liberation-Sans resolves via fontconfig: the flake's devShell pins
          # FONTCONFIG_FILE to a font set containing liberation_ttf, so this
          # works identically on every runner. ImageMagick font names are
          # HYPHENATED: "DejaVu Sans", "Helvetica" and "sans" do NOT resolve.
          OG_FONT='Liberation-Sans'

          # ImageMagick 7 ships `magick`; IM6 only has `convert`.
          if command -v magick >/dev/null 2>&1; then
            IM_CONVERT=(magick)
          else
            IM_CONVERT=(convert)
          fi

          # Tiles come from site/.scad-map, not a site/*.png glob: the glob
          # also swept the _top/_bottom/_front orthographic views written by
          # the complex_interior step, and the untiled montage was a
          # 1224x14168 strip (issue #458). One tile per project (meta.json
          # `hero` when it rendered), capped to the 5x3 grid.
          python3 -c "
          import glob, json, os, sys
          sys.path.insert(0, '.')
          from scripts.oembed_helpers import (
              parse_scad_map, load_meta_failures, og_hero_thumbnails,
              OG_HERO_MAX_TILES,
          )

          scad_map = parse_scad_map('site/.scad-map')
          failed = load_meta_failures()
          heroes = {}
          for path in sorted(glob.glob('*/meta.json')):
              if path in failed:
                  continue
              try:
                  with open(path) as f:
                      meta = json.load(f)
              except (OSError, json.JSONDecodeError):
                  continue
              hero = meta.get('hero')
              if hero:
                  heroes[os.path.dirname(path)] = hero

          existing = {os.path.basename(p) for p in glob.glob('site/*.png')}
          tiles = og_hero_thumbnails(scad_map, heroes, existing)
          print('OG hero tiles: %d of max %d' % (len(tiles), OG_HERO_MAX_TILES))
          with open(sys.argv[1], 'w') as out:
              for name in tiles:
                  print('  ' + name)
                  out.write('site/' + name + '\n')
          " "$RUNNER_TEMP/og-tiles.txt"

          ok=0
          mapfile -t THUMBS < "$RUNNER_TEMP/og-tiles.txt"
          if [ ${#THUMBS[@]} -gt 0 ] && [ -e "${THUMBS[0]}" ]; then
            # Two stages on purpose: -resize/-extent chained onto montage are
            # silently ignored (confirmed: the deployed og-hero.png was
            # 1224x14168). montage writes MIFF on stdout; the second stage
            # centres the grid on a 1200x630 dark canvas.
            if montage "${THUMBS[@]}" \
              -font "$OG_FONT" \
              -geometry 232x202+4+4 \
              -tile 5x3 \
              -background '#1a1a2e' \
              miff:- \
              | "${IM_CONVERT[@]}" miff:- \
                -font "$OG_FONT" \
                -background '#1a1a2e' \
                -gravity center \
                -extent 1200x630 \
                png:site/og-hero.png; then
              ok=1
            else
              echo "::warning::montage failed to composite og-hero.png; falling back to a plain hero image"
            fi
          fi

          if [ "$ok" -eq 0 ]; then
            if "${IM_CONVERT[@]}" -size 1200x630 xc:'#1a1a2e' \
              -font "$OG_FONT" \
              -gravity center -pointsize 48 -fill white \
              -annotate 0 '3D Printable Models' \
              site/og-hero.png; then
              ok=1
            fi
          fi

          if [ "$ok" -eq 0 ]; then
            rm -f site/og-hero.png
            echo "::warning::Could not generate site/og-hero.png; social previews will 404 for this deploy"
          else
            identify -format '%wx%h\n' site/og-hero.png || true
          fi

      - name: Generate models manifest
        run: |
          # Build grouped models.json from .scad-map, merging estimated_minutes from validation
          python3 -c "
          import json, os, sys
          sys.path.insert(0, '.')
          from scripts.oembed_helpers import load_meta_failures, project_display_name
          from scripts.project_dates import project_updated

          # Load OpenSCAD version used for this render
          openscad_version = ''
          try:
              with open('site/openscad-version.txt') as f:
                  openscad_version = f.read().strip()
          except FileNotFoundError:
              pass

          # Load validation results keyed by model name
          validation = {}
          try:
              with open('site/validation.json') as f:
                  for entry in json.load(f):
                      validation[entry['name']] = entry
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          failed_meta = load_meta_failures()

          # Manifests that failed validation are excluded from models.json
          # so the customizer never offers a broken parameter set.
          failed_params = set()
          try:
              with open('.param-failures') as f:
                  failed_params = {p.strip() for p in f if p.strip()}
          except FileNotFoundError:
              pass

          groups = {}
          with open('site/.scad-map') as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  stl, project_dir, source = line.split('\t', 2)
                  project_name = project_display_name(project_dir)
                  groups.setdefault(project_name, {'dir': project_dir, 'files': []})
                  file_entry = {'stl': stl, 'source': source}
                  qr_path = f\"site/qr/{stl.replace('.stl', '.png')}\"
                  if os.path.exists(qr_path):
                      file_entry['qr'] = f\"qr/{stl.replace('.stl', '.png')}\"
                  # Merge estimated_minutes from validation
                  val_name = stl.rsplit('.', 1)[0]
                  if val_name in validation and validation[val_name].get('estimated_minutes') is not None:
                      file_entry['estimated_minutes'] = validation[val_name]['estimated_minutes']
                  # Attach parameter manifest if present and validated.
                  # The customizer reads file_entry['parameters'] and
                  # discovers project sources via sources/<dir>/manifest.json.
                  source_basename = os.path.splitext(os.path.basename(source))[0]
                  params_path = os.path.join(project_dir, source_basename + '.parameters.json')
                  if os.path.isfile(params_path) and params_path not in failed_params:
                      try:
                          with open(params_path) as pf:
                              file_entry['parameters'] = json.load(pf)
                      except json.JSONDecodeError:
                          pass
                  groups[project_name]['files'].append(file_entry)

          # Last-commit date per project dir, for the landing page's recency
          # ordering. Empty on a shallow clone — see scripts/project_dates.py.
          updated = project_updated([g['dir'] for g in groups.values()])

          result = {}
          for k in sorted(groups):
              entry = {'dir': groups[k]['dir'], 'files': sorted(groups[k]['files'], key=lambda m: m['stl'])}
              zip_path = f\"site/{groups[k]['dir']}.zip\"
              if os.path.exists(zip_path):
                  entry['zip'] = f\"{groups[k]['dir']}.zip\"
              src_zip_path = f\"site/{groups[k]['dir']}-source.zip\"
              if os.path.exists(src_zip_path):
                  entry['sourceZip'] = f\"{groups[k]['dir']}-source.zip\"
              # Merge metadata from meta.json if it exists and passed validation
              meta_path = os.path.join(groups[k]['dir'], 'meta.json')
              if os.path.isfile(meta_path) and meta_path not in failed_meta:
                  try:
                      with open(meta_path) as mf:
                          meta = json.load(mf)
                  except json.JSONDecodeError:
                      meta = {}
                  # Only propagate viewer-relevant fields to the manifest.
                  # license, relatedModels, and mating_pairs are intentionally excluded.
                  for field in ('description', 'tags', 'difficulty', 'version', 'hardware', 'hero', 'assembly', 'printing_notes'):
                      if field in meta:
                          entry[field] = meta[field]
              if openscad_version:
                  entry['rendered_with'] = openscad_version
              if groups[k]['dir'] in updated:
                  entry['updated'] = updated[groups[k]['dir']]
              result[k] = entry

          with open('site/models.json', 'w') as f:
              json.dump(result, f, indent=2)
          "
          echo "Generated models.json:"
          cat site/models.json

      - name: Generate sitemap.xml
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from scripts.oembed_helpers import build_sitemap, parse_scad_map, stl_lastmods
          stls = sorted(parse_scad_map('site/.scad-map'))
          lastmods = stl_lastmods('site/models.json')
          with open('site/sitemap.xml', 'w') as f:
              f.write(build_sitemap(stls, lastmods))
          print(f'Wrote sitemap.xml with {len(stls) + 1} URLs, {len(lastmods)} with lastmod')
          "

      - name: Generate README gallery
        id: gallery
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: python3 scripts/generate-gallery.py

      - name: Smoke-test gallery script (PR only)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/generate-gallery.py && rc=0 || rc=$?
          git checkout -- README.md || true
          exit $rc

      - name: Generate structured data
        run: |
          python3 -c "
          import json, os, sys
          sys.path.insert(0, '.')
          from scripts.oembed_helpers import build_structured_data, load_meta_failures, parse_scad_map

          scad_map = parse_scad_map('site/.scad-map')
          failed_meta = load_meta_failures()

          project_descriptions = {}
          for stl, info in scad_map.items():
              project_dir = info['dir']
              if project_dir in project_descriptions:
                  continue
              meta_path = os.path.join(project_dir, 'meta.json')
              if os.path.isfile(meta_path) and meta_path not in failed_meta:
                  try:
                      with open(meta_path) as mf:
                          meta = json.load(mf)
                  except json.JSONDecodeError:
                      meta = {}
                  if 'description' in meta:
                      project_descriptions[project_dir] = meta['description']

          stl_sizes = {}
          for stl in scad_map:
              stl_path = f'site/{stl}'
              if os.path.isfile(stl_path):
                  stl_sizes[stl] = os.path.getsize(stl_path)

          jsonld = build_structured_data(scad_map, project_descriptions, stl_sizes)

          with open('site/structured-data.json', 'w') as f:
              json.dump(jsonld, f, indent=2)

          print('Generated structured-data.json')
          "

      - name: Generate OEmbed JSON files
        run: |
          python3 -c "
          import json, os, sys
          from html import escape
          from urllib.parse import quote
          sys.path.insert(0, '.')
          from scripts.oembed_helpers import slugify, display_name, thumbnail_name, parse_scad_map, BASE_URL

          scad_map = parse_scad_map('site/.scad-map')

          for stl, info in sorted(scad_map.items()):
              model_name = display_name(stl).title()
              project_slug = slugify(info['dir'])
              model_slug = slugify(stl)
              png = thumbnail_name(stl)
              embed_src = escape(f'{BASE_URL}/embed.html#{project_slug}/{model_slug}')

              oembed = {
                  'version': '1.0',
                  'type': 'rich',
                  'title': f\"{model_name} – {info['project']}\",
                  'provider_name': 'St. John Software',
                  'provider_url': 'https://www.bstjohn.net',
                  'thumbnail_url': f'{BASE_URL}/{quote(png)}',
                  'thumbnail_width': 800,
                  'thumbnail_height': 600,
                  'width': 800,
                  'height': 600,
                  # sandbox: allow-scripts needed for Three.js rendering,
                  # allow-same-origin needed to fetch models.json and STL files
                  # from the same origin. This is safe since embed.html is
                  # controlled first-party content.
                  'html': f'<iframe src=\"{embed_src}\" width=\"800\" height=\"600\" frameborder=\"0\" allowfullscreen sandbox=\"allow-scripts allow-same-origin\"></iframe>',
              }

              out_dir = f'site/oembed/{project_slug}'
              os.makedirs(out_dir, exist_ok=True)
              out_path = f'{out_dir}/{model_slug}.json'
              with open(out_path, 'w') as f:
                  json.dump(oembed, f, indent=2)
              print(f'  Generated {out_path}')
          "

      # Forgejo checks a pull_request run out at the PR head
      # (refs/pull/N/head), not a merge commit, so HEAD~1 is only the PR's
      # last commit. Diff PRs against their merge-base with the base branch
      # instead (fetch-depth: 0 above makes origin/<base> available).
      - name: Resolve diff base
        id: diff_base
        if: github.event_name == 'pull_request' || steps.issue_preview.outputs.enabled == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          else
            base="HEAD~1"
          fi
          echo "Diff base: $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Generate changed projects list
        if: github.event_name == 'pull_request' || steps.issue_preview.outputs.enabled == 'true'
        env:
          DIFF_BASE: ${{ steps.diff_base.outputs.base }}
        run: |
          # `|| true`: no .scad changes in the diff is a normal outcome, and
          # the job-level default shell runs with pipefail on.
          git diff --name-only "$DIFF_BASE" HEAD | { grep '\.scad$' || true; } | \
            sed 's|/.*||' | sort -u | \
            python3 -c "
          import json, sys
          sys.path.insert(0, '.')
          from scripts.oembed_helpers import project_display_name
          dirs = [d.strip() for d in sys.stdin if d.strip()]
          projects = [project_display_name(d) for d in dirs]
          with open('site/changed.json', 'w') as f:
              json.dump(projects, f)
          print('Changed projects:', projects)
          "

      - name: Copy index.html and embed.html to site with cache-busting hash and injected data
        run: |
          sed "s/__BUILD_HASH__/${GITHUB_SHA::8}/g" index.html > site/index.html
          sed "s/__BUILD_HASH__/${GITHUB_SHA::8}/g" embed.html > site/embed.html
          sed "s/__BUILD_HASH__/${GITHUB_SHA::8}/g" openscad-worker.js > site/openscad-worker.js
          cp filament-colors.json site/filament-colors.json
          cp favicon.svg site/favicon.svg
          cp site.webmanifest site/site.webmanifest
          cp robots.txt site/robots.txt
          cp llms.txt site/llms.txt
          python3 -c "
          import json, sys
          from html import escape
          sys.path.insert(0, '.')
          from scripts.oembed_helpers import slugify, display_name, parse_scad_map, BASE_URL

          with open('site/index.html') as f:
              html = f.read()

          # Inject structured data
          with open('site/structured-data.json') as f:
              jsonld = f.read()

          # Escape characters that could break out of <script> when embedded inline.
          jsonld = jsonld.replace('&', '\\u0026').replace('<', '\\u003c').replace('>', '\\u003e')

          tag = '<script type=\"application/ld+json\">\n' + jsonld + '\n</script>'
          html = html.replace('<!-- __STRUCTURED_DATA__ -->', tag)

          # Inject OEmbed discovery link tags
          link_tags = []
          for stl, info in sorted(parse_scad_map('site/.scad-map').items()):
              model_name = display_name(stl).title()
              project_slug = slugify(info['dir'])
              model_slug = slugify(stl)
              href = f'{BASE_URL}/oembed/{project_slug}/{model_slug}.json'
              title = f'{model_name} – {info[\"project\"]}'
              link_tags.append(f'<link rel=\"alternate\" type=\"application/json+oembed\" href=\"{escape(href)}\" title=\"{escape(title)}\">')

          html = html.replace('<!-- __OEMBED_LINKS__ -->', '\n  '.join(link_tags))

          with open('site/index.html', 'w') as f:
              f.write(html)

          print(f'Injected structured data and {len(link_tags)} OEmbed link tags into index.html')
          "

      - name: Write issue preview summary
        if: steps.issue_preview.outputs.enabled == 'true'
        continue-on-error: true
        env:
          ISSUE_ID: ${{ steps.issue_preview.outputs.issue_id }}
          SHORT_SHA: ${{ steps.issue_preview.outputs.short_sha }}
        run: |
          python3 scripts/preview_summary.py \
            --issue "$ISSUE_ID" --sha "$SHORT_SHA" --commit "$GITHUB_SHA" \
            --changed-from-git --site site \
            --out site/preview-summary.json \
            --markdown-out "${GITHUB_STEP_SUMMARY:-}"

      # Hard gate for the deploys, deliberately unconditional: the early
      # one-hour session may have lapsed during a long render, and if the
      # early step failed (it is best-effort) this is where a broken role or
      # trust policy turns the run red — after rendering and validation.
      - name: Refresh AWS credentials
        uses: https://github.com/aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: forgejo-actions-${{ github.run_id }}

      - name: Deploy to S3 (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.validate.outputs.failed != 'true' && steps.metadata.outputs.failed != 'true' && steps.interference.outputs.failed != 'true' && steps.param_meta.outputs.failed != 'true' && steps.thumbnails.outputs.failed != 'true'
        run: aws s3 sync ./site s3://www.bstjohn.net/3d-models/ --delete --exclude "pr-preview/*" --exclude "issue-preview/*" --exclude "render-cache/*" --exclude "render-cache-pr/*"

      - name: Commit README gallery update
        if: >-
          github.ref == 'refs/heads/main' && github.event_name == 'push'
          && steps.gallery.outcome == 'success'
          && steps.validate.outputs.failed != 'true'
        continue-on-error: true
        run: |
          if git diff --quiet README.md; then
            echo "README gallery is already up to date"
          else
            # Forgejo honours [skip ci] in the commit message below.
            git config user.name "forgejo-actions"
            git config user.email "forgejo-actions@noreply.git.home.bstjohn.net"
            git add README.md
            git commit -m "docs: update model gallery [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        run: |
          SHORT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHORT_SHA::8}"
          aws s3 sync ./site "s3://www.bstjohn.net/3d-models/pr-preview/pr-${{ github.event.number }}/${SHORT_SHA}/" --delete

      - name: Deploy issue preview
        # Ungated on validation, like PR previews, so a red candidate build
        # is still inspectable in the viewer.
        if: steps.issue_preview.outputs.enabled == 'true'
        env:
          ISSUE_ID: ${{ steps.issue_preview.outputs.issue_id }}
          SHORT_SHA: ${{ steps.issue_preview.outputs.short_sha }}
        run: |
          aws s3 sync ./site "s3://www.bstjohn.net/3d-models/issue-preview/${ISSUE_ID}/${SHORT_SHA}/" --delete

      # Posts or updates the "🔍 Model Preview" comment through the Forgejo
      # issues API with the run token. The body comes from
      # scripts/preview_summary.py — the same renderer as issue previews,
      # which reads canonical project names from site/models.json.
      - name: Comment on PR with thumbnails
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIFF_BASE: ${{ steps.diff_base.outputs.base }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/pr_preview_comment.py

      - name: Enforce mesh validation
        if: steps.validate.outputs.failed == 'true'
        run: |
          echo "::error::Mesh validation failed — one or more STL files have integrity issues. See the PR comment for details."
          cat site/validation.json
          exit 1

      - name: Enforce dependency graph check
        if: steps.depgraph.outputs.failed == 'true'
        run: |
          echo "::error::Dependency graphs are out of date. Run: bash scripts/scad-dep-graph.sh"
          exit 1

      - name: Enforce metadata validation
        if: steps.metadata.outputs.failed == 'true'
        run: |
          echo "::error::Metadata validation failed — one or more meta.json files don't match meta.schema.json"
          exit 1

      - name: Enforce interference check
        if: steps.interference.outputs.failed == 'true'
        run: |
          echo "::error::Mating part interference detected — one or more part pairs overlap. See the PR comment for details."
          cat site/interference.json
          exit 1

      - name: Enforce parameters validation
        if: steps.param_meta.outputs.failed == 'true'
        run: |
          echo "::error::Parameters manifest validation failed"
          cat .param-failures
          exit 1

      - name: Enforce thumbnail rendering
        if: steps.thumbnails.outputs.failed == 'true'
        run: |
          echo "::error::Thumbnail rendering produced no valid PNG for the models listed below. The flake's openscad wrapper renders offscreen via EGL/llvmpipe — check the gl_smoke step output and the openscadHeadless wrapper in flake.nix."
          cat .thumb-failures
          exit 1
