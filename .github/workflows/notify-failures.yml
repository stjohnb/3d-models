name: Notify on main build failure

# Triggers removed for the public snapshot — this workflow is intentionally disabled.
# See the private source repository for the active version.
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write

# `gh` comes from this repo's flake — the self-hosted NixOS runners provide
# only nix/git/docker, so every run step here executes inside the flake's
# `scripts` devShell via the job-level default shell. That needs the repo
# checked out first, which is why both jobs start with a checkout they
# didn't previously need.
jobs:
  notify:
    runs-on: [self-hosted, linux]
    concurrency:
      group: notify-failure
      cancel-in-progress: false
    if: github.event.workflow_run.conclusion == 'failure'
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#scripts --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          gh label create bug --color d73a4a --description "Something isn't working" --repo "$REPO" 2>/dev/null || true
          existing=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "Build failure: ${WORKFLOW_NAME} in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create \
              --repo "$REPO" \
              --title "Build failure: ${WORKFLOW_NAME}" \
              --body "Workflow **${WORKFLOW_NAME}** failed on \`main\`: ${RUN_URL}" \
              --label bug
          fi

  close-on-success:
    runs-on: [self-hosted, linux]
    concurrency:
      group: close-on-success
      cancel-in-progress: false
    if: github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#scripts --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
      - name: Close failure issue if build recovered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "Build failure: ${WORKFLOW_NAME} in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "Build recovered — closing automatically."
          fi
